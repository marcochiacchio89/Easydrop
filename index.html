<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyDrop PRO</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAtVYWeIyin713t6mQOUhz3f7NnDS-CCvI&libraries=places&callback=initAutocomplete" async defer></script>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; margin: 0; padding: 15px; }
        .container { max-width: 480px; margin: auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 12px; padding-right: 35px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        select { padding-right: 12px; }
        .input-container { position: relative; }
        .clear-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #888; font-size: 20px; font-weight: bold; padding: 0 5px; user-select: none; }
        .clear-btn:hover { color: #333; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 10px; }
        .btn-add { background: #28a745; color: white; }
        .btn-opt { background: #17a2b8; color: white; }
        .btn-guided { background: #ff9800; color: white; display: none; font-size: 16px; box-shadow: 0 3px 6px rgba(0,0,0,0.2); }
        
        /* Barra strumenti selezioni multiple */
        .batch-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding: 8px 10px; background: #e9ecef; border-radius: 6px; font-size: 14px; }
        .batch-buttons { display: flex; gap: 4px; }
        .btn-batch { border: none; padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; color: white; }
        .btn-batch-done { background: #28a745; }
        .btn-batch-highlight { background: #ffc107; color: #333; }
        .btn-batch-del { background: #dc3545; }
        
        .tappa { display: flex; justify-content: space-between; align-items: center; padding: 12px; margin-bottom: 8px; border-radius: 6px; background: #f8f9fa; border-left: 5px solid #007bff; cursor: pointer; }
        .tappa-left { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .evidenziata { background: #fff3cd; border-left-color: #ffc107; }
        .fatta { background: #d4edda; border-left-color: #28a745; text-decoration: line-through; color: #6c757d; }
        .btn-del { background: #dc3545; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h2>EasyDrop PRO 📦</h2>
    <label>Ditta:</label>
    <select id="ditta">
        <option>SDA</option>
        <option>BRT</option>
        <option>Poste Italiane</option>
        <option>GLS</option>
    </select>
    <label>Comune:</label>
    <div class="input-container">
        <input type="text" id="comune" placeholder="Inizia a scrivere il comune...">
        <span class="clear-btn" onclick="pulisciCampo('comune')">&times;</span>
    </div>
    <label>Indirizzo:</label>
    <div class="input-container">
        <input type="text" id="indirizzo" placeholder="Seleziona prima il comune...">
        <span class="clear-btn" onclick="pulisciCampo('indirizzo')">&times;</span>
    </div>
    <button class="btn btn-add" onclick="aggiungiTappa()">+ Aggiungi Tappa</button>
    <button class="btn btn-opt" onclick="ottimizzaGiro()">📍 Ottimizza Giro (GPS)</button>
    <button id="btn-guided" class="btn btn-guided" onclick="avanziaGiro()">🚀 INIZIA GIRO</button>
    
    <div id="batch-bar" style="display:none;" class="batch-actions">
        <label style="margin:0; display:flex; align-items:center; gap:4px; cursor:pointer; font-size:13px;">
            <input type="checkbox" id="seleziona-tutti" onclick="toggleSelezionaTutti(this)"> Tutti
        </label>
        <div class="batch-buttons">
            <button class="btn-batch btn-batch-done" onclick="impostaStatoSelezionate(true, false)">✅ Fatta</button>
            <button class="btn-batch btn-batch-highlight" onclick="toggleEvidenziaSelezionate()">🟡 Evidenzia</button>
            <button class="btn-batch btn-batch-del" onclick="eliminaSelezionate()">🗑 Elimina</button>
        </div>
    </div>

    <div id="lista" style="margin-top: 15px;"></div>
</div>
<script>
    let tappe = [];
    let geocoder;
    let autocompleteComune;
    let autocompleteInd;
    let giroIniziato = false;
    let comuneSelezionato = "";

    function initAutocomplete() {
        try {
            geocoder = new google.maps.Geocoder();
            
            autocompleteComune = new google.maps.places.Autocomplete(document.getElementById('comune'), { 
                types: ['locality'], 
                componentRestrictions: { country: 'it' } 
            });
            
            autocompleteInd = new google.maps.places.Autocomplete(document.getElementById('indirizzo'), { 
                componentRestrictions: { country: 'it' } 
            });

            autocompleteComune.addListener('place_changed', function() {
                const place = autocompleteComune.getPlace();
                if (place && place.geometry && place.geometry.viewport) {
                    comuneSelezionato = place.name || document.getElementById('comune').value;
                    autocompleteInd.setBounds(place.geometry.viewport);
                    autocompleteInd.setOptions({ strictBounds: true });
                    document.getElementById('indirizzo').value = '';
                    document.getElementById('indirizzo').placeholder = "Via in " + comuneSelezionato;
                }
            });

            document.getElementById('comune').addEventListener('input', function() {
                if (this.value.trim() === "") {
                    comuneSelezionato = "";
                    document.getElementById('indirizzo').placeholder = "Inserisci prima il comune...";
                }
            });
        } catch (e) {
            console.error("Errore nell'inizializzazione di Google Maps:", e);
        }
    }

    function pulisciCampo(id) {
        const el = document.getElementById(id);
        el.value = '';
        if (id === 'comune') {
            comuneSelezionato = "";
            document.getElementById('indirizzo').placeholder = "Inserisci prima il comune...";
        }
        el.focus();
    }

    function geocodeAddress(address) {
        return new Promise((resolve) => {
            if (!geocoder) { geocoder = new google.maps.Geocoder(); }
            geocoder.geocode({ address: address }, (results, status) => {
                if (status === 'OK' && results && results[0] && results[0].geometry) {
                    resolve({ lat: results[0].geometry.location.lat(), lng: results[0].geometry.location.lng() });
                } else { resolve(null); }
            });
        });
    }

    async function aggiungiTappa() {
        let com = comuneSelezionato || document.getElementById('comune').value.trim();
        const indInput = document.getElementById('indirizzo').value.trim();
        
        if (!com || !indInput) { 
            alert("Inserisci sia il comune che l'indirizzo!"); 
            return; 
        }
        
        let viaPulita = indInput;
        if (comuneSelezionato && viaPulita.toLowerCase().includes(comuneSelezionato.toLowerCase())) {
            viaPulita = viaPulita.replace(new RegExp(comuneSelezionato, 'gi'), '').replace(/,\s*,/g, ',').replace(/^,\s*|,\s*$/g, '').trim();
        }

        const indirizzoCompleto = `${viaPulita}, ${com}`;
        let lat = null;
        let lng = null;

        const place = autocompleteInd.getPlace();
        if (place && place.geometry && place.geometry.location) {
            lat = place.geometry.location.lat();
            lng = place.geometry.location.lng();
        } else {
            const coords = await geocodeAddress(indirizzoCompleto);
            if (coords) {
                lat = coords.lat;
                lng = coords.lng;
            }
        }

        tappe.push({ indirizzo: indirizzoCompleto, cliccata: false, fatta: false, selezionata: false, lat: lat, lng: lng });
        document.getElementById('indirizzo').value = '';
        render();
    }

    function render() {
        const list = document.getElementById('lista');
        const batchBar = document.getElementById('batch-bar');
        list.innerHTML = '';
        
        if (tappe.length > 0) {
            batchBar.style.display = 'flex';
        } else {
            batchBar.style.display = 'none';
            document.getElementById('seleziona-tutti').checked = false;
        }

        tappe.forEach((t, i) => {
            let classeStato = '';
            if (t.fatta) classeStato = 'fatta';
            else if (t.cliccata) classeStato = 'evidenziata';
            
            list.innerHTML += `<div class="tappa ${classeStato}" onclick="apriNavigatore(${i})">
                    <div class="tappa-left">
                        <input type="checkbox" ${t.selezionata ? 'checked' : ''} onclick="event.stopPropagation(); toggleSelezionaTappa(${i}, this)">
                        <span><strong>${i + 1}.</strong> ${t.indirizzo}</span>
                    </div>
                    <button class="btn-del" onclick="event.stopPropagation(); rimuoviTappa(${i})">X</button>
                </div>`;
        });
        aggiornaPulsanteGuida();
    }

    function toggleSelezionaTappa(i, checkbox) {
        tappe[i].selezionata = checkbox.checked;
        const tuttiSelezionati = tappe.length > 0 && tappe.every(t => t.selezionata);
        document.getElementById('seleziona-tutti').checked = tuttiSelezionati;
    }

    function toggleSelezionaTutti(checkbox) {
        const stato = checkbox.checked;
        tappe.forEach(t => t.selezionata = stato);
        render();
    }

    function impostaStatoSelezionate(fattaVal, cliccataVal) {
        const selezionate = tappe.filter(t => t.selezionata);
        if (selezionate.length === 0) {
            alert("Seleziona almeno una tappa tramite il flag.");
            return;
        }
        selezionate.forEach(t => {
            t.fatta = fattaVal;
            t.cliccata = fattaVal ? false : cliccataVal;
        });
        render();
    }

    function toggleEvidenziaSelezionate() {
        const selezionate = tappe.filter(t => t.selezionata);
        if (selezionate.length === 0) {
            alert("Seleziona almeno una tappa tramite il flag.");
            return;
        }
        const tutteEvidenziate = selezionate.every(t => t.cliccata);
        selezionate.forEach(t => {
            t.cliccata = !tutteEvidenziate;
        });
        render();
    }

    function eliminaSelezionate() {
        const daEliminare = tappe.filter(t => t.selezionata).length;
        if (daEliminare === 0) {
            alert("Seleziona almeno una tappa da eliminare.");
            return;
        }
        if (confirm(`Vuoi davvero eliminare ${daEliminare} tappe selezionate?`)) {
            tappe = tappe.filter(t => !t.selezionata);
            document.getElementById('seleziona-tutti').checked = false;
            render();
        }
    }

    function rimuoviTappa(i) { 
        tappe.splice(i, 1); 
        render(); 
    }

    function apriNavigatore(i) {
        if (tappe[i].fatta) return;
        tappe[i].cliccata = true;
        render();
        const url = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(tappe[i].indirizzo)}&travelmode=driving`;
        window.open(url, '_blank');
    }

    function calcolaDistanza(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function ottimizzaGiro() {
        if (tappe.length === 0) { alert("Aggiungi almeno una via!"); return; }
        if (!navigator.geolocation) { alert("GPS non supportato."); return; }
        
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const userLat = pos.coords.latitude;
            const userLng = pos.coords.longitude;
            
            for (let t of tappe) {
                if (t.lat === null || t.lng === null) {
                    const coords = await geocodeAddress(t.indirizzo);
                    if (coords) { t.lat = coords.lat; t.lng = coords.lng; }
                }
            }
            
            tappe.sort((a, b) => {
                if (a.fatta !== b.fatta) return a.fatta ? 1 : -1;
                const distA = (a.lat !== null && a.lng !== null) ? calcolaDistanza(userLat, userLng, a.lat, a.lng) : 99999;
                const distB = (b.lat !== null && b.lng !== null) ? calcolaDistanza(userLat, userLng, b.lat, b.lng) : 99999;
                return distA - distB;
            });
            
            giroIniziato = false;
            render();
            alert("Giro ottimizzato dalla tua posizione!");
        }, (err) => { alert("Attiva il GPS!"); });
    }

    function avanziaGiro() {
        const prossimoIndex = tappe.findIndex(t => !t.fatta);
        if (prossimoIndex === -1) { alert("Tutto consegnato!"); return; }
        giroIniziato = true;
        apriNavigatore(prossimoIndex);
    }

    function aggiornaPulsanteGuida() {
        const btnGuided = document.getElementById('btn-guided');
        if (tappe.length === 0) { btnGuided.style.display = 'none'; return; }
        const prossimoIndex = tappe.findIndex(t => !t.fatta);
        if (prossimoIndex === -1) { btnGuided.style.display = 'block'; btnGuided.innerText = "🎉 GIRO COMPLETATO"; btnGuided.style.background = "#28a745"; }
        else if (giroIniziato) { btnGuided.style.display = 'block'; btnGuided.innerText = `▶ CONTINUA (${prossimoIndex + 1}° Consegna)`; btnGuided.style.background = "#ff9800"; }
        else { btnGuided.style.display = 'block'; btnGuided.innerText = "🚀 INIZIA GIRO"; btnGuided.style.background = "#ff9800"; }
    }
</script>
</body>
</html>
