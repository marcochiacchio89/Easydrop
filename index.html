<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyDrop PRO V 3.5</title>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAtVYWeIyin713t6mQOUhz3f7NnDS-CCvI&libraries=places&callback=initAutocomplete" async defer></script>

<!-- OCR locale nel browser -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
:root {
    --bg-body: #f4f6f9;
    --bg-container: #fff;
    --text-main: #333;
    --primary-color: #007bff;
    --btn-add: #28a745;
    --btn-opt: #17a2b8;
    --btn-guided: #ff9800;
}

body {
    font-family: sans-serif;
    background: var(--bg-body);
    margin: 0;
    padding: 15px;
    transition: background 0.3s ease;
}

.container {
    max-width: 480px;
    margin: auto;
    background: var(--bg-container);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
    position: relative;
}

/* HEADER */
.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

h2 {
    text-align: center;
    color: var(--text-main);
    margin: 0;
    flex-grow: 1;
}

.menu-btn {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: var(--text-main);
    padding: 0 5px;
}

/* MENU LATERALE */
.side-menu {
    height: 100%;
    width: 0;
    position: fixed;
    z-index: 1000;
    top: 0;
    right: 0;
    background-color: #fff;
    overflow-x: hidden;
    transition: 0.3s;
    box-shadow: -4px 0 10px rgba(0,0,0,0.2);
    padding-top: 60px;
}

.side-menu a {
    padding: 12px 20px;
    text-decoration: none;
    font-size: 16px;
    color: #333;
    display: block;
    transition: 0.2s;
    border-bottom: 1px solid #eee;
}

.side-menu a:hover {
    background-color: #f1f1f1;
    color: var(--primary-color);
}

.side-menu .close-btn {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 26px;
    border: none;
    background: none;
    cursor: pointer;
}

label {
    font-weight: bold;
    font-size: 14px;
    color: #555;
    display: block;
    margin-top: 10px;
}

input,
select {
    width: 100%;
    padding: 12px;
    padding-right: 35px;
    margin: 6px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 15px;
}

select {
    padding-right: 12px;
}

input:disabled {
    background-color: #e9ecef;
    cursor: not-allowed;
}

.input-container {
    position: relative;
}

.clear-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #888;
    font-size: 20px;
    font-weight: bold;
    padding: 0 5px;
    user-select: none;
}

.clear-btn:hover {
    color: #333;
}

/* BOTTONI */
.btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
    margin-top: 10px;
    transition: background 0.3s ease;
}

.btn-add {
    background: var(--btn-add);
    color: white;
}

.btn-opt {
    background: var(--btn-opt);
    color: white;
}

.btn-guided {
    background: var(--btn-guided);
    color: white;
    display: none;
    font-size: 16px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
}

/* ========================= */
/* FOTOCAMERA / OCR */
/* ========================= */

.camera-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
}

.camera-row .input-container {
    flex: 1;
}

.btn-camera {
    width: 100%;
    margin-top: 6px;
    background: #6f42c1;
    color: #fff;
    padding: 12px 10px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
}

.btn-camera:disabled {
    opacity: 0.65;
    cursor: wait;
}

#cameraInput {
    display: none;
}

.scan-status {
    display: none;
    font-size: 12px;
    color: #555;
    margin-top: 6px;
    text-align: center;
}

/* POPUP OCR */

.modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: rgba(0,0,0,0.55);
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
}

.modal {
    width: 100%;
    max-width: 470px;
    background: #fff;
    border-radius: 12px;
    padding: 18px;
    box-sizing: border-box;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
}

.modal h3 {
    margin: 0 0 8px;
    color: var(--text-main);
}

.modal p {
    margin: 5px 0 12px;
    font-size: 13px;
    color: #666;
}

.modal input {
    margin: 6px 0 12px;
    padding-right: 12px;
}

.modal-actions {
    display: flex;
    gap: 8px;
}

.modal-actions button {
    flex: 1;
    border: none;
    border-radius: 6px;
    padding: 12px;
    font-weight: bold;
    cursor: pointer;
}

.btn-confirm {
    background: #28a745;
    color: #fff;
}

.btn-cancel {
    background: #e9ecef;
    color: #333;
}

.ocr-preview {
    font-size: 11px;
    color: #777;
    background: #f8f9fa;
    padding: 8px;
    border-radius: 6px;
    max-height: 100px;
    overflow: auto;
    white-space: pre-wrap;
    margin-bottom: 10px;
}

/* BARRA SELEZIONI */
.batch-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 15px;
    padding: 8px 10px;
    background: #e9ecef;
    border-radius: 6px;
    font-size: 14px;
}

.batch-buttons {
    display: flex;
    gap: 4px;
}

.btn-batch {
    border: none;
    padding: 6px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    color: white;
}

.btn-batch-done {
    background: #28a745;
}

.btn-batch-highlight {
    background: #ffc107;
    color: #333;
}

.btn-batch-del {
    background: #dc3545;
}

/* TAPPE */
.tappa {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 6px;
    background: #f8f9fa;
    border-left: 5px solid var(--primary-color);
    cursor: pointer;
}

.tappa-left {
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
    flex-direction: column;
    align-items: flex-start;
    width: 100%;
}

.tappa-text {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
}

.tappa-note {
    font-size: 12px;
    color: #666;
    font-style: italic;
    margin-top: 4px;
    display: block;
}

.evidenziata {
    background: #fff3cd;
    border-left-color: #ffc107;
}

.fatta {
    background: #d4edda;
    border-left-color: #28a745;
    text-decoration: line-through;
    color: #6c757d;
}

.btn-del {
    background: #dc3545;
    color: white;
    border: none;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

    <div class="app-header">
        <h2>EasyDrop PRO V 3.5 📦</h2>
        <button class="menu-btn" onclick="apriMenu()">☰</button>
    </div>

    <!-- MENU HAMBURGER -->
    <div id="sideMenu" class="side-menu">

        <button class="close-btn" onclick="chiudiMenu()">
            &times;
        </button>

        <a href="#" onclick="chiudiMenu(); alert('Sezione Profilo in arrivo');">
            👤 Profilo
        </a>

        <a href="#" onclick="chiudiMenu(); alert('Sezione Impostazioni in arrivo');">
            ⚙️ Impostazioni
        </a>

        <a href="#" onclick="chiudiMenu(); alert('Sezione Assistenza in arrivo');">
            ️ Assistenza
        </a>

    </div>

    <label>Ditta:</label>

    <select id="ditta" onchange="cambiaTemaDitta()">
        <option value="SDA">SDA</option>
        <option value="BRT">BRT</option>
        <option value="Poste Italiane">Poste Italiane</option>
        <option value="GLS">GLS</option>
        <option value="DHL">DHL</option>
    </select>

    <label>Comune:</label>

    <div class="input-container">
        <input
            type="text"
            id="comune"
            placeholder="Inizia a scrivere il comune..."
        >

        <span
            class="clear-btn"
            onclick="pulisciCampo('comune')"
        >
            &times;
        </span>
    </div>

    <label>Indirizzo:</label>

    <div class="camera-row">

        <div class="input-container">

            <input
                type="text"
                id="indirizzo"
                placeholder="Seleziona prima il comune..."
                disabled
            >

            <span
                class="clear-btn"
                onclick="pulisciCampo('indirizzo')"
            >
                &times;
            </span>

        </div>

        <div style="width:145px;">

            <button
                type="button"
                class="btn-camera"
                id="btnCamera"
                onclick="apriFotocamera()"
            >
                📷 Scansiona LdV
            </button>

        </div>

    </div>

    <!-- INPUT FOTOCAMERA -->
    <input
        id="cameraInput"
        type="file"
        accept="image/*"
        capture="environment"
        onchange="gestisciFotoLdV(event)"
    >

    <div
        id="scanStatus"
        class="scan-status"
    >
        🔎 Sto leggendo la lettera di vettura...
    </div>

    <label>Note (facoltativo):</label>

    <input
        type="text"
        id="note"
        placeholder="es. Citofono Rossi, ZTL, Pacco blu..."
    >

    <button
        class="btn btn-add"
        onclick="aggiungiTappa()"
    >
        + Aggiungi Tappa
    </button>

    <button
        class="btn btn-opt"
        onclick="ottimizzaGiro()"
    >
        📍 Ottimizza Giro (GPS)
    </button>

    <button
        id="btn-guided"
        class="btn btn-guided"
        onclick="avanzaiGiro()"
    >
        🚀 INIZIA GIRO
    </button>

    <div
        id="batch-bar"
        style="display:none;"
        class="batch-actions"
    >

        <label
            style="margin:0; display:flex; align-items:center; gap:4px; cursor:pointer; font-size:13px;"
        >

            <input
                type="checkbox"
                id="seleziona-tutti"
                onclick="toggleSelezionaTutti(this)"
            >

            Tutti

        </label>

        <div class="batch-buttons">

            <button
                class="btn-batch btn-batch-done"
                onclick="toggleFattaSelezionate()"
            >
                ✅ Fatta
            </button>

            <button
                class="btn-batch btn-batch-highlight"
                onclick="toggleEvidenziaSelezionate()"
            >
                🟡 Evidenzia
            </button>

            <button
                class="btn-batch btn-batch-del"
                onclick="eliminaSelezionate()"
            >
                🗑 Elimina
            </button>

        </div>

    </div>

    <div
        id="lista"
        style="margin-top:15px;"
    ></div>

</div>


<!-- ========================= -->
<!-- POPUP CONFERMA OCR -->
<!-- ========================= -->

<div
    id="ocrModal"
    class="modal-backdrop"
    role="dialog"
    aria-modal="true"
>

    <div class="modal">

        <h3>
            📷 Indirizzo rilevato
        </h3>

        <p>
            Controlla l'indirizzo letto sulla lettera di vettura.
            Puoi correggerlo prima di confermare.
        </p>

        <input
            type="text"
            id="ocrAddressInput"
            placeholder="Indirizzo rilevato"
        >

        <div
            class="ocr-preview"
            id="ocrRawText"
        ></div>

        <div class="modal-actions">

            <button
                class="btn-cancel"
                onclick="chiudiOCR()"
            >
                Modifica / Annulla
            </button>

            <button
                class="btn-confirm"
                onclick="confermaOCR()"
            >
                ✅ Conferma indirizzo
            </button>

        </div>

    </div>

</div>


<script>

let tappe = [];

let geocoder;

let autocompleteComune;

let autocompleteInd;

let giroIniziato = false;

let comuneSelezionato = "";


/* ========================= */
/* MENU */
/* ========================= */

function apriMenu() {

    document.getElementById("sideMenu").style.width = "250px";

}

function chiudiMenu() {

    document.getElementById("sideMenu").style.width = "0";

}


/* ========================= */
/* TEMA DITTA */
/* ========================= */

function cambiaTemaDitta() {

    const ditta =
        document.getElementById('ditta').value;

    const root =
        document.documentElement;

    if (ditta === "SDA") {

        root.style.setProperty('--bg-body', '#eef3f9');
        root.style.setProperty('--primary-color', '#003366');
        root.style.setProperty('--btn-add', '#003366');
        root.style.setProperty('--btn-opt', '#d4af37');
        root.style.setProperty('--btn-guided', '#003366');

    }

    else if (ditta === "BRT") {

        root.style.setProperty('--bg-body', '#fcf2f2');
        root.style.setProperty('--primary-color', '#cc0000');
        root.style.setProperty('--btn-add', '#cc0000');
        root.style.setProperty('--btn-opt', '#333333');
        root.style.setProperty('--btn-guided', '#cc0000');

    }

    else if (ditta === "Poste Italiane") {

        root.style.setProperty('--bg-body', '#fdfae5');
        root.style.setProperty('--primary-color', '#004225');
        root.style.setProperty('--btn-add', '#e6af00');
        root.style.setProperty('--btn-opt', '#004225');
        root.style.setProperty('--btn-guided', '#e6af00');

    }

    else if (ditta === "GLS") {

        root.style.setProperty('--bg-body', '#f7f4f4');
        root.style.setProperty('--primary-color', '#002060');
        root.style.setProperty('--btn-add', '#002060');
        root.style.setProperty('--btn-opt', '#c00000');
        root.style.setProperty('--btn-guided', '#002060');

    }

    else if (ditta === "DHL") {

        root.style.setProperty('--bg-body', '#fffbe6');
        root.style.setProperty('--primary-color', '#d40511');
        root.style.setProperty('--btn-add', '#d40511');
        root.style.setProperty('--btn-opt', '#ffcc00');
        root.style.setProperty('--btn-guided', '#d40511');

    }

}


window.addEventListener(
    'DOMContentLoaded',
    () => {
        cambiaTemaDitta();
    }
);


/* ========================= */
/* GOOGLE AUTOCOMPLETE */
/* ========================= */

function initAutocomplete() {

    try {

        geocoder =
            new google.maps.Geocoder();

        autocompleteComune =
            new google.maps.places.Autocomplete(
                document.getElementById('comune'),
                {
                    types: ['locality'],
                    componentRestrictions: {
                        country: 'it'
                    }
                }
            );

        autocompleteInd =
            new google.maps.places.Autocomplete(
                document.getElementById('indirizzo'),
                {
                    componentRestrictions: {
                        country: 'it'
                    }
                }
            );


        autocompleteComune.addListener(
            'place_changed',
            function() {

                const place =
                    autocompleteComune.getPlace();

                const indInput =
                    document.getElementById('indirizzo');

                if (
                    place &&
                    place.geometry &&
                    place.geometry.viewport
                ) {

                    comuneSelezionato =
                        place.name ||
                        document.getElementById('comune').value;

                    autocompleteInd.setBounds(
                        place.geometry.viewport
                    );

                    autocompleteInd.setOptions({
                        strictBounds: true
                    });

                    indInput.disabled = false;

                    indInput.value = '';

                    indInput.placeholder =
                        "Via in " + comuneSelezionato;

                }

            }
        );


        document
            .getElementById('comune')
            .addEventListener(
                'input',
                function() {

                    const val =
                        this.value.trim();

                    const indInput =
                        document.getElementById('indirizzo');

                    if (val === "") {

                        comuneSelezionato = "";

                        indInput.value = "";

                        indInput.disabled = true;

                        indInput.placeholder =
                            "Seleziona prima il comune...";

                    }

                    else {

                        indInput.disabled = false;

                        indInput.placeholder =
                            "Inserisci via...";

                    }

                }
            );

    }

    catch (e) {

        console.error("Errore:", e);

    }

}


/* ========================= */
/* PULIZIA CAMPI */
/* ========================= */

function pulisciCampo(id) {

    const el =
        document.getElementById(id);

    el.value = '';

    if (id === 'comune') {

        comuneSelezionato = "";

        const indInput =
            document.getElementById('indirizzo');

        indInput.value = "";

        indInput.disabled = true;

        indInput.placeholder =
            "Seleziona prima il comune...";

    }

    el.focus();

}


/* ========================= */
/* GEOCODING */
/* ========================= */

function geocodeAddress(address) {

    return new Promise(
        (resolve) => {

            if (!geocoder) {

                geocoder =
                    new google.maps.Geocoder();

            }

            geocoder.geocode(
                {
                    address: address
                },
                (results, status) => {

                    if (
                        status === 'OK' &&
                        results &&
                        results[0] &&
                        results[0].geometry
                    ) {

                        resolve({

                            lat:
                                results[0]
                                    .geometry
                                    .location
                                    .lat(),

                            lng:
                                results[0]
                                    .geometry
                                    .location
                                    .lng()

                        });

                    }

                    else {

                        resolve(null);

                    }

                }
            );

        }
    );

}


/* ================================================= */
/* FOTOCAMERA + OCR                                  */
/* ================================================= */

function apriFotocamera() {

    const comune =
        document
            .getElementById('comune')
            .value
            .trim();

    if (!comune) {

        alert(
            'Seleziona prima il comune.'
        );

        return;

    }

    document
        .getElementById('cameraInput')
        .click();

}

/* ELABORA FOTO */
/* ========================= */

    const status =

    btn.disabled = true;

    status.style.display = 'block';

    status.textContent =

    t
