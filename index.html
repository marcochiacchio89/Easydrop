<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyDrop PRO V 4.0</title>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAtVYWeIyin713t6mQOUhz3f7NnDS-CCvI&libraries=places&callback=initAutocomplete" async defer></script>

<style>
:root {
    --bg-body: #f4f6f9;
    --bg-container: #fff;
    --text-main: #333;
    --primary-color: #007bff;
    --btn-add: #28a745;
    --btn-opt: #17a2b8;
    --btn-guided: #ff9800;
}

body {
    font-family: sans-serif;
    background: var(--bg-body);
    margin: 0;
    padding: 15px;
    transition: background 0.3s ease;
}

.container {
    max-width: 480px;
    margin: auto;
    background: var(--bg-container);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
    position: relative;
}

/* HEADER */
.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

h2 {
    text-align: center;
    color: var(--text-main);
    margin: 0;
    flex-grow: 1;
}

.menu-btn {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: var(--text-main);
    padding: 0 5px;
}

/* MENU LATERALE */
.side-menu {
    height: 100%;
    width: 0;
    position: fixed;
    z-index: 1000;
    top: 0;
    right: 0;
    background-color: #fff;
    overflow-x: hidden;
    transition: 0.3s;
    box-shadow: -4px 0 10px rgba(0,0,0,0.2);
    padding-top: 60px;
}

.side-menu a {
    padding: 12px 20px;
    text-decoration: none;
    font-size: 16px;
    color: #333;
    display: block;
    transition: 0.2s;
    border-bottom: 1px solid #eee;
}

.side-menu a:hover {
    background-color: #f1f1f1;
    color: var(--primary-color);
}

.side-menu .close-btn {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 26px;
    border: none;
    background: none;
    cursor: pointer;
}

label {
    font-weight: bold;
    font-size: 14px;
    color: #555;
    display: block;
    margin-top: 10px;
}

input,
select {
    width: 100%;
    padding: 12px;
    padding-right: 35px;
    margin: 6px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 15px;
}

select {
    padding-right: 12px;
}

.input-container {
    position: relative;
}

.clear-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #888;
    font-size: 20px;
    font-weight: bold;
    padding: 0 5px;
    user-select: none;
}

.clear-btn:hover {
    color: #333;
}

/* BOTTONI */
.btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
    margin-top: 10px;
    transition: background 0.3s ease;
}

.btn-add {
    background: var(--btn-add);
    color: white;
}

.btn-opt {
    background: var(--btn-opt);
    color: white;
}

.btn-guided {
    background: var(--btn-guided);
    color: white;
    display: none;
    font-size: 16px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
}

/* ========================= */
/* FOTOCAMERA / OCR          */
/* ========================= */

.camera-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
}

.camera-row .input-container {
    flex: 1;
}

.btn-camera {
    width: 100%;
    margin-top: 6px;
    background: #6f42c1;
    color: #fff;
    padding: 12px 10px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
}

.btn-camera:disabled {
    opacity: 0.65;
    cursor: wait;
}

#cameraInput {
    display: none;
}

.scan-status {
    display: none;
    font-size: 12px;
    color: #555;
    margin-top: 6px;
    text-align: center;
}

/* POPUP OCR */

.modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: rgba(0,0,0,0.55);
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
}

.modal {
    width: 100%;
    max-width: 470px;
    background: #fff;
    border-radius: 12px;
    padding: 18px;
    box-sizing: border-box;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
}

.modal h3 {
    margin: 0 0 8px;
    color: var(--text-main);
}

.modal p {
    margin: 5px 0 12px;
    font-size: 13px;
    color: #666;
}

.modal input {
    margin: 6px 0 12px;
    padding-right: 12px;
}

.modal-actions {
    display: flex;
    gap: 8px;
}

.modal-actions button {
    flex: 1;
    border: none;
    border-radius: 6px;
    padding: 12px;
    font-weight: bold;
    cursor: pointer;
}

.btn-confirm {
    background: #28a745;
    color: #fff;
}

.btn-cancel {
    background: #e9ecef;
    color: #333;
}

.ocr-preview {
    font-size: 11px;
    color: #777;
    background: #f8f9fa;
    padding: 8px;
    border-radius: 6px;
    max-height: 100px;
    overflow: auto;
    white-space: pre-wrap;
    margin-bottom: 10px;
}

/* BARRA SELEZIONI */
.batch-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 15px;
    padding: 8px 10px;
    background: #e9ecef;
    border-radius: 6px;
    font-size: 14px;
}

.batch-buttons {
    display: flex;
    gap: 4px;
}

.btn-batch {
    border: none;
    padding: 6px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    color: white;
}

.btn-batch-done {
    background: #28a745;
}

.btn-batch-highlight {
    background: #ffc107;
    color: #333;
}

.btn-batch-del {
    background: #dc3545;
}

/* TAPPE */
.tappa {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 6px;
    background: #f8f9fa;
    border-left: 5px solid var(--primary-color);
    cursor: pointer;
}

.tappa-left {
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
    flex-direction: column;
    align-items: flex-start;
    width: 100%;
}

.tappa-text {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
}

.tappa-note {
    font-size: 12px;
    color: #666;
    font-style: italic;
    margin-top: 4px;
    display: block;
}

.evidenziata {
    background: #fff3cd;
    border-left-color: #ffc107;
}

.fatta {
    background: #d4edda;
    border-left-color: #28a745;
    text-decoration: line-through;
    color: #6c757d;
}

.btn-del {
    background: #dc3545;
    color: white;
    border: none;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

    <div class="app-header">
        <h2>EasyDrop PRO V 4.0 📦</h2>
        <button class="menu-btn" onclick="apriMenu()">☰</button>
    </div>

    <!-- MENU HAMBURGER -->
    <div id="sideMenu" class="side-menu">

        <button class="close-btn" onclick="chiudiMenu()">
            &times;
        </button>

        <a href="#" onclick="chiudiMenu(); alert('Sezione Profilo in arrivo');">
            👤 Profilo
        </a>

        <a href="#" onclick="chiudiMenu(); alert('Sezione Impostazioni in arrivo');">
            ⚙️ Impostazioni
        </a>

        <a href="#" onclick="chiudiMenu(); alert('Sezione Assistenza in arrivo');">
            ️ Assistenza
        </a>

    </div>

    <label>Ditta:</label>

    <select id="ditta" onchange="cambiaTemaDitta()">
        <option value="SDA">SDA</option>
        <option value="BRT">BRT</option>
        <option value="Poste Italiane">Poste Italiane</option>
        <option value="GLS">GLS</option>
        <option value="DHL">DHL</option>
    </select>

    <label>Comune:</label>

    <div class="input-container">

            placeholder="Scansiona LdV o scrivi il comune..."
        >

            onclick="pulisciCampo('comune')"

            &times;
        </span>
    </div>

    <label>Indirizzo:</label>

    <div class="camera-row">

        <div class="input-container">

            <input
                type="text"
                id="indirizzo"
                placeholder="Scansiona LdV o scrivi la via..."
            >

            <span
                class="clear-btn"
                onclick="pulisciCampo('indirizzo')"
            >
                &times;
            </span>

        </div>

        <div style="width:145px;">

            <button
                type="button"
                class="btn-camera"
                id="btnCamera"
                onclick="apriFotocamera()"
            >
                📷 Scansiona LdV
            </button>

        </div>

    </div>

    <!-- INPUT FOTOCAMERA -->
    <input
        id="cameraInput"
        type="file"
        accept="image/*"
        capture="environment"

    >

    <div

    >
        🔎 Sto leggendo la lettera di vettura con Google Cloud...
    </div>

    <label>Note (facoltativo):</label>

    <input
        type="text"
        id="note"
        placeholder="es. Citofono Rossi, ZTL, Pacco blu..."
    >

    <button
        class="btn btn-add"
        onclick="aggiungiTappa()"
    >
        + Aggiungi Tappa
    </button>

    <button
        class="btn btn-opt"
        onclick="ottimizzaGiro()"
    >
        📍 Ottimizza Giro (GPS)
    </button>

    <button
        id="btn-guided"
        class="btn btn-guided"
        onclick="avanzaiGiro()"
    >
        🚀 INIZIA GIRO
    </button>

    <div
        id="batch-bar"
        style="display:none;"
        class="batch-actions"
    >

        <label
            style="margin:0; display:flex; align-items:center; gap:4px; cursor:pointer; font-size:13px;"
        >

            <input
                type="checkbox"

                onclick="toggleSelezionaTutti(this)"
            >

            Tutti

        </label>

        <div class="batch-buttons">

            <button
                class="btn-batch btn-batch-done"
                onclick="toggleFattaSelezionate()"
            >
                ✅ Fatta
            </button>

            <button
                class="btn-batch btn-batch-highlight"
                onclick="toggleEvidenziaSelezionate()"
            >
                🟡 Evidenzia
            </button>

            <button
                class="btn-batch btn-batch-del"
                onclick="eliminaSelezionate()"
            >
                🗑 Elimina
            </button>

        </div>

    </div>

    <div

        style="margin-top:15px;"
    ></div>

</div>


<!-- ========================= -->
<!-- POPUP CONFERMA OCR        -->
<!-- ========================= -->

<div
    id="ocrModal"
    class="modal-backdrop"
    role="dialog"
    aria-modal="true"
>

    <div class="modal">

        <h3>
            📷 Indirizzo rilevato
        </h3>

        <p>
            Controlla l'indirizzo letto sulla lettera di vettura.
            Puoi correggerlo prima di confermare.
        </p>

        <input
            type="text"
            id="ocrAddressInput"
            placeholder="Indirizzo rilevato"
        >

        <div
            class="ocr-preview"
            id="ocrRawText"
        ></div>

        <div class="modal-actions">

            <button
                class="btn-cancel"
                onclick="chiudiOCR()"
            >
                Modifica / Annulla
            </button>

            <button
                class="btn-confirm"
                onclick="confermaOCR()"
            >
                ✅ Conferma indirizzo
            </button>

        </div>

    </div>

</div>


<script>

let tappe = [];

let geocoder;

let autocompleteComune;

let autocompleteInd;

let giroIniziato = false;

let comuneSelezionato = "";


/* ========================= */
/* MENU                      */
/* ========================= */

function apriMenu() {
    document.getElementById("sideMenu").style.width = "250px";
}

function chiudiMenu() {
    document.getElementById("sideMenu").style.width = "0";
}


/* ========================= */
/* TEMA DITTA                */
/* ========================= */

function cambiaTemaDitta() {

    const ditta = document.getElementById('ditta').value;
    const root = document.documentElement;

    if (ditta === "SDA") {
        root.style.setProperty('--bg-body', '#eef3f9');
        root.style.setProperty('--primary-color', '#003366');
        root.style.setProperty('--btn-add', '#003366');
        root.style.setProperty('--btn-opt', '#d4af37');
        root.style.setProperty('--btn-guided', '#003366');
    }
    else if (ditta === "BRT") {
        root.style.setProperty('--bg-body', '#fcf2f2');
        root.style.setProperty('--primary-color', '#cc0000');
        root.style.setProperty('--btn-add', '#cc0000');
        root.style.setProperty('--btn-opt', '#333333');
        root.style.setProperty('--btn-guided', '#cc0000');
    }
    else if (ditta === "Poste Italiane") {
        root.style.setProperty('--bg-body', '#fdfae5');
        root.style.setProperty('--primary-color', '#004225');
        root.style.setProperty('--btn-add', '#e6af00');
        root.style.setProperty('--btn-opt', '#004225');
        root.style.setProperty('--btn-guided', '#e6af00');
    }
    else if (ditta === "GLS") {
        root.style.setProperty('--bg-body', '#f7f4f4');
        root.style.setProperty('--primary-color', '#002060');
        root.style.setProperty('--btn-add', '#002060');
        root.style.setProperty('--btn-opt', '#c00000');
        root.style.setProperty('--btn-guided', '#002060');
    }
    else if (ditta === "DHL") {
        root.style.setProperty('--bg-body', '#fffbe6');
        root.style.setProperty('--primary-color', '#d40511');
        root.style.setProperty('--btn-add', '#d40511');
        root.style.setProperty('--btn-opt', '#ffcc00');
        root.style.setProperty('--btn-guided', '#d40511');
    }
}

window.addEventListener('DOMContentLoaded', () => {
    cambiaTemaDitta();
});


/* ========================= */
/* GOOGLE AUTOCOMPLETE       */
/* ========================= */

function initAutocomplete() {

    try {
        geocoder = new google.maps.Geocoder();

        autocompleteComune = new google.maps.places.Autocomplete(
            document.getElementById('comune'),
            {
                types: ['locality'],
                componentRestrictions: { country: 'it' }
            }
        );

        autocompleteInd = new google.maps.places.Autocomplete(
            document.getElementById('indirizzo'),
            {
                componentRestrictions: { country: 'it' }
            }
        );

        autocompleteComune.addListener('place_changed', function() {
            const place = autocompleteComune.getPlace();
            if (place && place.name) {
                comuneSelezionato = place.name;
            }
        });

    } catch (e) {
        console.error("Errore:", e);
    }
}


/* ========================= */
/* PULIZIA CAMPI             */
/* ========================= */

function pulisciCampo(id) {
    const el = document.getElementById(id);
    el.value = '';

    if (id === 'comune') {
        comuneSelezionato = "";
    }
    el.focus();
}


/* ========================= */
/* GEOCODING                 */
/* ========================= */

function geocodeAddress(address) {
    return new Promise((resolve) => {
        if (!geocoder) {
            geocoder = new google.maps.Geocoder();
        }

        geocoder.geocode({ address: address }, (results, status) => {
            if (status === 'OK' && results && results[0] && results[0].geometry) {
                resolve({
                    lat: results[0].geometry.location.lat(),
                    lng: results[0].geometry.location.lng()
                });
            } else {
                resolve(null);
            }
        });
    });
}


/* ================================================= */
/* FOTOCAMERA + GOOGLE CLOUD VISION OCR              */
/* ================================================= */

function apriFotocamera() {
    // Apertura immediata della fotocamera senza alcun blocco sul comune
    document.getElementById('cameraInput').click();
}


async function gestisciFotoLdV(event) {
    const file = event.target.files && event.target.files[0];
    event.target.value = '';

    if (!file) return;

    const btn = document.getElementById('btnCamera');
    const status = document.getElementById('scanStatus');

    btn.disabled = true;
    status.style.display = 'block';
    status.textContent = '🔎 Elaborazione foto e lettura Cloud Vision...';

    try {
        const base64Image = await toBase64(file);
        const imageContent = base64Image.split(',')[1];
        const apiKey = estraiApiKeyMaps();

        if (!apiKey || apiKey === "INSERISCI_LA_TUA_CHIAVE_API_QUI") {
            throw new Error("Chiave API Google non configurata correttamente nell'intestazione HTML.");
        }

        const response = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=${apiKey}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                requests: [
                    {
                        image: { content: imageContent },
                        features: [{ type: 'DOCUMENT_TEXT_DETECTION' }]
                    }
                ]
            })
        });

        const data = await response.json();

        if (data.error) {
            throw new Error(data.error.message || "Errore restituito da Google Vision");
        }

        const annotations = data.responses && data.responses[0];
        const testo = (annotations && annotations.fullTextAnnotation && annotations.fullTextAnnotation.text) || 
                      (annotations && annotations.textAnnotations && annotations.textAnnotations[0] && annotations.textAnnotations[0].description) || '';

        if (!testo) {
            throw new Error("Nessun testo rilevato nell'immagine.");
        }

        // Estrazione intelligente di via e comune combinati
        const risultatoOCR = estraiIndirizzoDaOCR(testo);

        if (!risultatoOCR.indirizzo) {
            status.style.display = 'none';
            alert('Non sono riuscito a riconoscere con certezza l\'indirizzo. Prova a fotografare più da vicino la zona del destinatario.');
            return;
        }

        let stringaComposta = risultatoOCR.indirizzo;
        if (risultatoOCR.comune) {
            stringaComposta += ', ' + risultatoOCR.comune;
        }

        apriPopupOCR(stringaComposta, testo);

    } catch (err) {
        console.error(err);
        alert('Errore durante la lettura della lettera di vettura: ' + err.message);
    } finally {
        btn.disabled = false;
        status.style.display = 'none';
    }
}

function toBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}

function estraiApiKeyMaps() {
    const scripts = document.getElementsByTagName('script');
    for (let s of scripts) {
        const src = s.getAttribute('src');
        if (src && src.includes('maps.googleapis.com/maps/api/js')) {
            const urlParams = new URLSearchParams(src.split('?')[1]);
            return urlParams.get('key');
        }
    }
    return null;
}


/* ========================= */
/* NORMALIZZA E ANALIZZA OCR */
/* ========================= */

function normalizzaTestoOCR(testo) {
    return testo
        .replace(/\r/g, '')
        .split('\n')
        .map(r => r.replace(/[|]{2,}/g, ' ').replace(/\s+/g, ' ').trim())
        .filter(Boolean);
}

function estraiIndirizzoDaOCR(testo) {
    const righe = normalizzaTestoOCR(testo);
    const paroleVia = /(via|viale|piazza|piazzale|corso|lungomare|largo|vicolo|strada|contrada|traversa|borgo|calle|rotonda|loc\.?|localit[aà])\b/i;
    
    let viaTrovata = "";
    let comuneTrovato = "";

    // 1. ISOLIAMO IL DESTINATARIO
    // Cerchiamo la riga che contiene "Destinatario" per scartare il Mittente
    let indiceDestinatario = righe.findIndex(r => r.toLowerCase().includes('destinatario'));
    let righeDestinatario = righe;

    if (indiceDestinatario !== -1) {
        // Tagliamo il testo: teniamo solo le righe da "Destinatario" in poi
        righeDestinatario = righe.slice(indiceDestinatario);
    } else {
        // Fallback: se l'OCR non legge bene la parola "destinatario", 
        // cerchiamo "Mittente" e saltiamo le sue 3-4 righe di indirizzo
        let indiceMittente = righe.findIndex(r => r.toLowerCase().includes('mittente'));
        if (indiceMittente !== -1 && righe.length > indiceMittente + 3) {
            righeDestinatario = righe.slice(indiceMittente + 3);
        }
    }

    // 2. CERCHIAMO LA VIA (solo nel blocco del destinatario)
    for (let i = 0; i < righeDestinatario.length; i++) {
        let r = righeDestinatario[i];
        if (paroleVia.test(r)) {
            let indirizzoCompletoRiga = r;
            if (i + 1 < righeDestinatario.length && /^\d{1,5}(?:\s*[\/\-]\s*\d{1,5})?[A-Za-z]?\b/.test(righeDestinatario[i+1]) && !paroleVia.test(righeDestinatario[i+1])) {
                indirizzoCompletoRiga += ' ' + righeDestinatario[i+1];
            }
            viaTrovata = indirizzoCompletoRiga;
            break;
        }
    }

    if (!viaTrovata) {
        for (let i = 0; i < righeDestinatario.length; i++) {
            if (/\b\d{1,5}(?:\s*[\/\-]\s*\d{1,5})?[A-Za-z]?\b/.test(righeDestinatario[i]) && i > 0 && paroleVia.test(righeDestinatario[i-1])) {
                viaTrovata = righeDestinatario[i-1] + ' ' + righeDestinatario[i];
                break;
            }
        }
    }

    // 3. CERCHIAMO IL COMUNE (sempre solo nel blocco del destinatario)
    for (let j = 0; j < righeDestinatario.length; j++) {
        let r = righeDestinatario[j];
        
        // Ignoriamo la parola "CAP" isolata per evitare interferenze con il riquadro in alto a sinistra
        if (r.toLowerCase().includes('cap')) continue;

        const capMatch = r.match(/\b(\d{5})\b/);
        if (capMatch) {
            let pulito = r.replace(capMatch[0], '').replace(/\b[A-Z]{2}\b/g, '').replace(/[()]/g, '').trim();
            if (pulito.length > 2) {
                comuneTrovato = pulito;
                break;
            }
        }
    }

    if (viaTrovata) {
        viaTrovata = viaTrovata.replace(/^(destinatario|consegna|indirizzo|address|shipping address)\s*[:\-]?\s*/i, '').trim();
    }

    return {
        indirizzo: viaTrovata.slice(0, 100),
        comune: comuneTrovato.slice(0, 50)
    };
}


/* ========================= */
/* POPUP OCR                 */
/* ========================= */

function apriPopupOCR(indirizzo, testoCompleto) {
    document.getElementById('ocrAddressInput').value = indirizzo;
    document.getElementById('ocrRawText').textContent = testoCompleto || 'Nessun testo OCR disponibile.';
    document.getElementById('ocrModal').style.display = 'flex';
    setTimeout(() => document.getElementById('ocrAddressInput').focus(), 100);
}

function chiudiOCR() {
    document.getElementById('ocrModal').style.display = 'none';
}


/* ========================= */
/* CONFERMA INDIRIZZO OCR    */
/* ========================= */

function confermaOCR() {
    const valore = document.getElementById('ocrAddressInput').value.trim();

    if (!valore) {
        alert('Inserisci o correggi l\'indirizzo prima di confermare.');
        return;
    }

    // Se l'indirizzo contiene una virgola, compila automaticamente sia via che comune
    if (valore.includes(',')) {
        const parti = valore.split(',');
        const ind = parti[0].trim();
        const com = parti.slice(1).join(',').trim();
        document.getElementById('indirizzo').value = ind;
        if (com) {
            document.getElementById('comune').value = com;
            comuneSelezionato = com;
        }
    } else {
        document.getElementById('indirizzo').value = valore;
    }

    chiudiOCR();
    aggiungiTappa();
}


/* ================================================= */
/* AGGIUNGI TAPPA                                    */
/* ================================================= */

async function aggiungiTappa() {
    let com = comuneSelezionato || document.getElementById('comune').value.trim();
    let indInput = document.getElementById('indirizzo').value.trim();

    // Gestione intelligente se l'utente ha scritto l'indirizzo completo nel campo via
    if (!com && indInput.includes(',')) {
        const parti = indInput.split(',');
        indInput = parti[0].trim();
        com = parti.slice(1).join(',').trim();
        document.getElementById('indirizzo').value = indInput;
        document.getElementById('comune').value = com;
        comuneSelezionato = com;
    }

    if (!com || !indInput) {
        alert("Inserisci sia il comune che l'indirizzo!");
        return;
    }

    const indirizzoCompleto = `${indInput}, ${com}`;
    let lat = null;
    let lng = null;

    const place = autocompleteInd ? autocompleteInd.getPlace() : null;

    if (place && place.geometry && place.geometry.location) {
        lat = place.geometry.location.lat();
        lng = place.geometry.location.lng();
    } else {
        const coords = await geocodeAddress(indirizzoCompleto);
        if (coords) {
            lat = coords.lat;
            lng = coords.lng;
        }
    }

    tappe.push({
        indirizzo: indirizzoCompleto,
        note: document.getElementById('note').value.trim(),
        cliccata: false,
        fatta: false,
        selezionata: false,
        lat: lat,
        lng: lng
    });

    document.getElementById('indirizzo').value = '';
    document.getElementById('note').value = '';
    render();
}


/* ================================================= */
/* RENDER LISTA                                      */
/* ================================================= */

function render() {
    const list = document.getElementById('lista');
    const batchBar = document.getElementById('batch-bar');

    list.innerHTML = '';

    if (tappe.length > 0) {
        batchBar.style.display = 'flex';
    } else {
        batchBar.style.display = 'none';
        document.getElementById('seleziona-tutti').checked = false;
    }

    tappe.forEach((t, i) => {
        let classeStato = '';

        if (t.fatta) {
            classeStato = 'fatta';
        } else if (t.cliccata) {
            classeStato = 'evidenziata';
        }

        list.innerHTML += `
            <div class="tappa ${classeStato}" onclick="apriNavigatore(${i})">
                <div class="tappa-left">
                    <div class="tappa-text">
                        <input type="checkbox" ${t.selezionata ? 'checked' : ''} onclick="event.stopPropagation(); toggleSelezionaTappa(${i}, this)">
                        <span>
                            <strong>${i + 1}.</strong> ${t.indirizzo}
                        </span>
                    </div>
                    ${t.note ? `<span class="tappa-note">📝 ${t.note}</span>` : ''}
                </div>
                <button class="btn-del" onclick="event.stopPropagation(); rimuoviTappa(${i})">X</button>
            </div>
        `;
    });

    aggiornaPulsanteGuida();
}


/* ================================================= */
/* SELEZIONE TAPPE                                   */
/* ================================================= */

function toggleSelezionaTappa(i, checkbox) {
    tappe[i].selezionata = checkbox.checked;
    const tuttiSelezionati = tappe.length > 0 && tappe.every(t => t.selezionata);
    document.getElementById('seleziona-tutti').checked = tuttiSelezionati;
}

function toggleSelezionaTutti(checkbox) {
    const stato = checkbox.checked;
    tappe.forEach(t => t.selezionata = stato);
    render();
}


/* ================================================= */
/* FATTA                                             */
/* ================================================= */

function toggleFattaSelezionate() {
    const selezionate = tappe.filter(t => t.selezionata);

    if (selezionate.length === 0) {
        alert("Seleziona almeno una tappa.");
        return;
    }

    const tutteFatte = selezionate.every(t => t.fatta);

    selezionate.forEach(t => {
        t.fatta = !tutteFatte;
        if (!tutteFatte) {
            t.cliccata = false;
        }
    });

    render();
}


/* ================================================= */
/* EVIDENZIA                                         */
/* ================================================= */

function toggleEvidenziaSelezionate() {
    const selezionate = tappe.filter(t => t.selezionata);

    if (selezionate.length === 0) {
        alert("Seleziona almeno una tappa.");
        return;
    }

    const tutteEvidenziate = selezionate.every(t => t.cliccata);

    selezionate.forEach(t => {
        t.cliccata = !tutteEvidenziate;
    });

    render();
}


/* ================================================= */
/* ELIMINA                                           */
/* ================================================= */

function eliminaSelezionate() {
    const daEliminare = tappe.filter(t => t.selezionata).length;

    if (daEliminare === 0) {
        alert("Seleziona almeno una tappa.");
        return;
    }

    if (confirm(`Vuoi eliminare ${daEliminare} tappe?`)) {
        tappe = tappe.filter(t => !t.selezionata);
        document.getElementById('seleziona-tutti').checked = false;
        render();
    }
}

function rimuoviTappa(i) {
    tappe.splice(i, 1);
    render();
}


/* ================================================= */
/* NAVIGATORE                                        */
/* ================================================= */

function apriNavigatore(i) {
    if (tappe[i].fatta) {
        return;
    }

    tappe[i].cliccata = true;
    render();

    const url = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(tappe[i].indirizzo)}&travelmode=driving`;
    window.open(url, '_blank');
}


/* ================================================= */
/* DISTANZA                                          */
/* ================================================= */

function calcolaDistanza(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}


/* ================================================= */
/* OTTIMIZZA GIRO                                    */
/* ================================================= */

async function ottimizzaGiro() {
    if (tappe.length === 0) {
        alert("Aggiungi almeno una via!");
        return;
    }

    if (!navigator.geolocation) {
        alert("GPS non supportato.");
        return;
    }

    navigator.geolocation.getCurrentPosition(async (pos) => {
        const userLat = pos.coords.latitude;
        const userLng = pos.coords.longitude;

        let nonFatte = tappe.filter(t => !t.fatta);

        if (nonFatte.length === 0) {
            alert("Tutte le tappe sono state completate!");
            return;
        }

        for (let t of nonFatte) {
            if (t.lat === null || t.lng === null) {
                const coords = await geocodeAddress(t.indirizzo);
                if (coords) {
                    t.lat = coords.lat;
                    t.lng = coords.lng;
                }
            }
        }

        nonFatte.sort((a, b) => {
            const distA = (a.lat && a.lng) ? calcolaDistanza(userLat, userLng, a.lat, a.lng) : 99999;
            const distB = (b.lat && b.lng) ? calcolaDistanza(userLat, userLng, b.lat, b.lng) : 99999;
            return distA - distB;
        });

        tappe = [...nonFatte, ...tappe.filter(t => t.fatta)];
        render();
    }, () => {
        alert("Impossibile ottenere la posizione.");
    });
}


/* ================================================= */
/* PULSANTE GUIDA                                    */
/* ================================================= */

function aggiornaPulsanteGuida() {
    const btn = document.getElementById('btn-guided');
    btn.style.display = tappe.length > 0 ? 'block' : 'none';
}


/* ================================================= */
/* INIZIA GIRO                                       */
/* ================================================= */

function avanzaiGiro() {
    const prossima = tappe.find(t => !t.fatta);

    if (prossima) {
        const index = tappe.indexOf(prossima);
        apriNavigatore(index);
    } else {
        alert("Giro terminato!");
    }
}

</script>
