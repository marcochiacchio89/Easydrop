<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyDrop - Navigazione</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; padding: 15px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-add { background: #28a745; color: white; }
        .btn-nav { background: #ff9800; color: white; }
        li { background: #fff; padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
<div class="container">
    <h2>EasyDrop 📦</h2>
    <input type="text" id="comune" placeholder="Comune">
    <input type="text" id="indirizzo_input" placeholder="Indirizzo">
    <button class="btn-add" onclick="aggiungi()">+ Aggiungi</button>
    
    <ul id="lista"></ul>
    
    <button class="btn-nav" onclick="apriMappe()">🚀 Vai alla prossima consegna</button>
</div>

<script>
    let tappe = [];

    function aggiungi() {
        const ind = document.getElementById('indirizzo_input').value;
        const com = document.getElementById('comune').value;
        if(ind) {
            tappe.push(ind + ", " + com);
            render();
            document.getElementById('indirizzo_input').value = '';
        }
    }

    function render() {
        const list = document.getElementById('lista');
        list.innerHTML = '';
        tappe.forEach((t, i) => {
            list.innerHTML += `<li>${i+1}. ${t}</li>`;
        });
    }

    function apriMappe() {
        if (tappe.length === 0) {
            alert("Nessuna consegna in lista!");
            return;
        }
        // Prende il primo indirizzo della lista e apre Google Maps
        const destinazione = encodeURIComponent(tappe[0]);
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${destinazione}&travelmode=driving`, '_blank');
        
        // Chiede se vuoi rimuoverlo dalla lista
        if (confirm("Sei partito? Una volta arrivato, clicca OK per rimuovere la consegna e passare alla prossima.")) {
            tappe.shift(); // Rimuove il primo elemento
            render();
        }
    }
</script>
</body>
</html>
