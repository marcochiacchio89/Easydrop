<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyDrop PRO V 3.5</title>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAtVYWeIyin713t6mQOUhz3f7NnDS-CCvI&libraries=places&callback=initAutocomplete" async defer></script>

<!-- OCR locale nel browser -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
:root {
    --bg-body: #f4f6f9;
    --bg-container: #fff;
    --text-main: #333;
    --primary-color: #007bff;
    --btn-add: #28a745;
    --btn-opt: #17a2b8;
    --btn-guided: #ff9800;
}

body {
    font-family: sans-serif;
    background: var(--bg-body);
    margin: 0;
    padding: 15px;
    transition: background 0.3s ease;
}

.container {
    max-width: 480px;
    margin: auto;
    background: var(--bg-container);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
    position: relative;
}

/* HEADER */
.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

h2 {
    text-align: center;
    color: var(--text-main);
    margin: 0;
    flex-grow: 1;
}

.menu-btn {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: var(--text-main);
    padding: 0 5px;
}

/* MENU LATERALE */
.side-menu {
    height: 100%;
    width: 0;
    position: fixed;
    z-index: 1000;
    top: 0;
    right: 0;
    background-color: #fff;
    overflow-x: hidden;
    transition: 0.3s;
    box-shadow: -4px 0 10px rgba(0,0,0,0.2);
    padding-top: 60px;
}

.side-menu a {
    padding: 12px 20px;
    text-decoration: none;
    font-size: 16px;
    color: #333;
    display: block;
    transition: 0.2s;
    border-bottom: 1px solid #eee;
}

.side-menu a:hover {
    background-color: #f1f1f1;
    color: var(--primary-color);
}

.side-menu .close-btn {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 26px;
    border: none;
    background: none;
    cursor: pointer;
}

label {
    font-weight: bold;
    font-size: 14px;
    color: #555;
    display: block;
    margin-top: 10px;
}

input,
select {
    width: 100%;
    padding: 12px;
    padding-right: 35px;
    margin: 6px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 15px;
}

select {
    padding-right: 12px;
}

input:disabled {
    background-color: #e9ecef;
    cursor: not-allowed;
}

.input-container {
    position: relative;
}

.clear-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #888;
    font-size: 20px;
    font-weight: bold;
    padding: 0 5px;
    user-select: none;
}

.clear-btn:hover {
    color: #333;
}

/* BOTTONI */
.btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
    margin-top: 10px;
    transition: background 0.3s ease;
}

.btn-add {
    background: var(--btn-add);
    color: white;
}

.btn-opt {
    background: var(--btn-opt);
    color: white;
}

.btn-guided {
    background: var(--btn-guided);
    color: white;
    display: none;
    font-size: 16px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
}

/* ========================= */
/* FOTOCAMERA / OCR */
/* ========================= */

.camera-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
}

.camera-row .input-container {
    flex: 1;
}

.btn-camera {
    width: 100%;
    margin-top: 6px;
    background: #6f42c1;
    color: #fff;
    padding: 12px 10px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
}

.btn-camera:disabled {
    opacity: 0.65;
    cursor: wait;
}

#cameraInput {
    display: none;
}

.scan-status {
    display: none;
    font-size: 12px;
    color: #555;
    margin-top: 6px;
    text-align: center;
}

/* POPUP OCR */

.modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: rgba(0,0,0,0.55);
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
}

.modal {
    width: 100%;
    max-width: 470px;
    background: #fff;
    border-radius: 12px;
    padding: 18px;
    box-sizing: border-box;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
}

.modal h3 {
    margin: 0 0 8px;
    color: var(--text-main);
}

.modal p {
    margin: 5px 0 12px;
    font-size: 13px;
    color: #666;
}

.modal input {
    margin: 6px 0 12px;
    padding-right: 12px;
}

.modal-actions {
    display: flex;
    gap: 8px;
}

.modal-actions button {
    flex: 1;
    border: none;
    border-radius: 6px;
    padding: 12px;
    font-weight: bold;
    cursor: pointer;
}

.btn-confirm {
    background: #28a745;
    color: #fff;
}

.btn-cancel {
    background: #e9ecef;
    color: #333;
}

.ocr-preview {
    font-size: 11px;
    color: #777;
    background: #f8f9fa;
    padding: 8px;
    border-radius: 6px;
    max-height: 100px;
    overflow: auto;
    white-space: pre-wrap;
    margin-bottom: 10px;
}

/* BARRA SELEZIONI */
.batch-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 15px;
    padding: 8px 10px;
    background: #e9ecef;
    border-radius: 6px;
    font-size: 14px;
}

.batch-buttons {
    display: flex;
    gap: 4px;
}

.btn-batch {
    border: none;
    padding: 6px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    color: white;
}

.btn-batch-done {
    background: #28a745;
}

.btn-batch-highlight {
    background: #ffc107;
    color: #333;
}

.btn-batch-del {
    background: #dc3545;
}

/* TAPPE */
.tappa {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 6px;
    background: #f8f9fa;
    border-left: 5px solid var(--primary-color);
    cursor: pointer;
}

.tappa-left {
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
    flex-direction: column;
    align-items: flex-start;
    width: 100%;
}

.tappa-text {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
}

.tappa-note {
    font-size: 12px;
    color: #666;
    font-style: italic;
    margin-top: 4px;
    display: block;
}

.evidenziata {
    background: #fff3cd;
    border-left-color: #ffc107;
}

.fatta {
    background: #d4edda;
    border-left-color: #28a745;
    text-decoration: line-through;
    color: #6c757d;
}

.btn-del {
    background: #dc3545;
    color: white;
    border: none;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

    <div class="app-header">
        <h2>EasyDrop PRO V 3.5 📦</h2>
        <button class="menu-btn" onclick="apriMenu()">☰</button>
    </div>

    <!-- MENU HAMBURGER -->
    <div id="sideMenu" class="side-menu">

        <button class="close-btn" onclick="chiudiMenu()">
            &times;
        </button>

        </a>

            ⚙️ Impostazioni

    </div>

    <label>Ditta:</label>

    <select id="ditta" onchange="cambiaTemaDitta()">
        <option value="SDA">SDA</option>
        <option value="BRT">BRT</option>
        <option value="Poste Italiane">Poste Italiane</option>
        <option value="GLS">GLS</option>

            id="comune"

    <label>Indirizzo:</label>

            <input

            </span>

            <button

                class="btn-camera"

<script>

let tappe = [];

let geocoder;

let autocompleteComune;

let autocompleteInd;

let giroIniziato = false;

let comuneSelezionato = "";


/* ========================= */
/* MENU */
/* ========================= */

function apriMenu() {

    document.getElementById("sideMenu").style.width = "250px";

}

function chiudiMenu() {

    document.getElementById("sideMenu").style.width = "0";

}


/* ========================= */
/* TEMA DITTA */
/* ========================= */

function cambiaTemaDitta() {

    const ditta =
        document.getElementById('ditta').value;

    const root =
        document.documentElement;

    if (ditta === "SDA") {

        root.style.setProperty('--bg-body', '#eef3f9');
        root.style.setProperty('--primary-color', '#003366');
        root.style.setProperty('--btn-add', '#003366');
        root.style.setProperty('--btn-opt', '#d4af37');
        root.style.setProperty('--btn-guided', '#003366');

    }

    else if (ditta === "BRT") {

        root.style.setProperty('--bg-body', '#fcf2f2');
        root.style.setProperty('--primary-color', '#cc0000');
        root.style.setProperty('--btn-add', '#cc0000');
        root.style.setProperty('--btn-opt', '#333333');
        root.style.setProperty('--btn-guided', '#cc0000');

    }

    else if (ditta === "Poste Italiane") {

        root.style.setProperty('--bg-body', '#fdfae5');
        root.style.setProperty('--primary-color', '#004225');
        root.style.setProperty('--btn-add', '#e6af00');
        root.style.setProperty('--btn-opt', '#004225');
        root.style.setProperty('--btn-guided', '#e6af00');

    }

    else if (ditta === "GLS") {

        root.style.setProperty('--bg-body', '#f7f4f4');
        root.style.setProperty('--primary-color', '#002060');
        root.style.setProperty('--btn-add', '#002060');
        root.style.setProperty('--btn-opt', '#c00000');
        root.style.setProperty('--btn-guided', '#002060');

    }

    else if (ditta === "DHL") {

        root.style.setProperty('--bg-body', '#fffbe6');
        root.style.setProperty('--primary-color', '#d40511');
        root.style.setProperty('--btn-add', '#d40511');
        root.style.setProperty('--btn-opt', '#ffcc00');
        root.style.setProperty('--btn-guided', '#d40511');

    }

}


window.addEventListener(
    'DOMContentLoaded',
    () => {
        cambiaTemaDitta();
    }
);


/* ========================= */
/* GOOGLE AUTOCOMPLETE */
/* ========================= */

function initAutocomplete() {

    try {

        geocoder =
            new google.maps.Geocoder();

        autocompleteComune =
            new google.maps.places.Autocomplete(
                document.getElementById('comune'),
                {
                    types: ['locality'],
                    componentRestrictions: {
                        country: 'it'
                    }
                }
            );

        autocompleteInd =
            new google.maps.places.Autocomplete(
                document.getElementById('indirizzo'),
                {
                    componentRestrictions: {
                        country: 'it'
                    }
                }
            );


        autocompleteComune.addListener(
            'place_changed',
            function() {

                const place =
                    autocompleteComune.getPlace();

                const indInput =
                    document.getElementById('indirizzo');

                if (
                    place &&
                    place.geometry &&
                    place.geometry.viewport
                ) {

                    comuneSelezionato =
                        place.name ||
                        document.getElementById('comune').value;

                    autocompleteInd.setBounds(
                        place.geometry.viewport
                    );

                    autocompleteInd.setOptions({
                        strictBounds: true
                    });

                    indInput.disabled = false;

                    indInput.value = '';

                    indInput.placeholder =
                        "Via in " + comuneSelezionato;

                }

            }
        );


        document
            .getElementById('comune')
            .addEventListener(
                'input',
                function() {

                    const val =
                        this.value.trim();

                    const indInput =
                        document.getElementById('indirizzo');

                    if (val === "") {

                        comuneSelezionato = "";

                        indInput.value = "";

                        indInput.disabled = true;

                        indInput.placeholder =
                            "Seleziona prima il comune...";

                    }

                    else {

                        indInput.disabled = false;

                        indInput.placeholder =
                            "Inserisci via...";

                    }

                }
            );

    }

    catch (e) {

        console.error("Errore:", e);

    }

}


/* ========================= */
/* PULIZIA CAMPI */
/* ========================= */

function pulisciCampo(id) {

    const el =
        document.getElementById(id);

    el.value = '';

    if (id === 'comune') {

        comuneSelezionato = "";

        const indInput =
            document.getElementById('indirizzo');

        indInput.value = "";

        indInput.disabled = true;

        indInput.placeholder =
            "Seleziona prima il comune...";

    }

    el.focus();

}


/* ========================= */
/* GEOCODING */
/* ========================= */

function geocodeAddress(address) {

    return new Promise(
        (resolve) => {

            if (!geocoder) {

                geocoder =
                    new google.maps.Geocoder();

            }

            geocoder.geocode(
                {
                    address: address
                },
                (results, status) => {

                    if (
                        status === 'OK' &&
                        results &&
                        results[0] &&
                        results[0].geometry
                    ) {

                        resolve({

                            lat:
                                results[0]
                                    .geometry
                                    .location
                                    .lat(),

                            lng:
                                results[0]
                                    .geometry
                                    .location
                                    .lng()

                        });

                    }

                    else {

                        resolve(null);

                    }

                }
            );

        }
    );

}


/* ================================================= */
/* FOTOCAMERA + OCR                                  */
/* ================================================= */

function apriFotocamera() {

    const comune =
        document
            .getElementById('comune')
            .value
            .trim();

    if (!comune) {

        alert(
            'Seleziona prima il comune.'
        );

        return;

    }

    document
        .getElementById('cameraInput')
        .click();

}


/* ========================= */
/* ELABORA FOTO */
/* ========================= */

async function gestisciFotoLdV(event) {

    const file =
        event.target.files &&
        event.target.files[0];

    event.target.value = '';

    if (!file) return;


    const btn =
        document.getElementById('btnCamera');

    const status =
        document.getElementById('scanStatus');


    btn.disabled = true;

    status.style.display = 'block';

    status.textContent =
        '🔎 Sto leggendo la lettera di vettura...';


    try {

        if (typeof Tesseract === 'undefined') {

            throw new Error(
                'Motore OCR non disponibile.'
            );

        }


        const risultato =
            await Tesseract.recognize(
                file,
                'ita+eng',
                {

                    logger: m => {

                        if (
                            m &&
                            m.status ===
                            'recognizing text' &&
                            typeof m.progress ===
                            'number'
                        ) {

                            status.textContent =
                                `🔎 Lettura lettera di vettura... ${Math.round(m.progress * 100)}%`;

                        }

                    }

                }
            );


        const testo =
            (
                risultato.data &&
                risultato.data.text
            )
            ?
            risultato.data.text
            :
            '';


        const candidato =
            estraiIndirizzoDaOCR(testo);


        if (!candidato) {

            status.style.display = 'none';

            alert(
                'Non sono riuscito a riconoscere con sufficiente certezza l\'indirizzo. Prova a fotografare più da vicino la zona del destinatario.'
            );

            return;

        }


        apriPopupOCR(
            candidato,
            testo
        );

    }

    catch (err) {

        console.error(err);

        alert(
            'Errore durante la lettura della lettera di vettura. Riprova con una foto più nitida.'
        );

    }

    finally {

        btn.disabled = false;

        status.style.display = 'none';

    }

}


/* ========================= */
/* NORMALIZZA OCR */
/* ========================= */

function normalizzaTestoOCR(testo) {

    return testo
        .replace(/\r/g, '')
        .split('\n')
        .map(
            r =>
                r
                    .replace(/[|]{2,}/g, ' ')
                    .replace(/\s+/g, ' ')
                    .trim()
        )
        .filter(Boolean);

}


/* ========================= */
/* TROVA INDIRIZZO */
/* ========================= */

function estraiIndirizzoDaOCR(testo) {

    const righe =
        normalizzaTestoOCR(testo);


    const paroleVia =
        /(via|viale|piazza|piazzale|corso|lungomare|largo|vicolo|strada|contrada|traversa|borgo|calle|rotonda|loc\.?|localit[aà])\b/i;


    const righeCandidati = [];


    for (
        let i = 0;
        i < righe.length;
        i++
    ) {

        let r = righe[i];


        if (paroleVia.test(r)) {

            righeCandidati.push({
                r,
                i,
                score: 10
            });

        }


        if (/\b\d{5}\b/.test(r)) {

            righeCandidati.push({
                r,
                i,
                score: 7
            });

        }


        if (
            /\b\d{1,5}(?:\s*[\/\-]\s*\d{1,5})?[A-Za-z]?\b/.test(r) &&
            righe[i - 1] &&
            paroleVia.test(righe[i - 1])
        ) {

            righeCandidati.push({

                r:
                    righe[i - 1] +
                    ' ' +
                    r,

                i: i - 1,

                score: 12

            });

        }

    }


    if (!righeCandidati.length) {

        return '';

    }


    righeCandidati.sort(
        (a, b) =>
            b.score - a.score
    );


    let candidato =
        righeCandidati[0].r;


    candidato =
        candidato.replace(
            /^(destinatario|consegna|indirizzo|address|shipping address)\s*[:\-]?\s*/i,
            ''
        )
        .trim();


    return candidato.slice(
        0,
        180
    );

}


/* ========================= */
/* POPUP OCR */
/* ========================= */

function apriPopupOCR(
    indirizzo,
    testoCompleto
) {

    document
        .getElementById('ocrAddressInput')
        .value = indirizzo;


    document
        .getElementById('ocrRawText')
        .textContent =
            testoCompleto ||
            'Nessun testo OCR disponibile.';


    document
        .getElementById('ocrModal')
        .style.display = 'flex';


    setTimeout(
        () =>
            document
                .getElementById(
                    'ocrAddressInput'
                )
                .focus(),
        100
    );

}


function chiudiOCR() {

    document
        .getElementById('ocrModal')
        .style.display = 'none';

}


/* ========================= */
/* CONFERMA INDIRIZZO OCR */
/* ========================= */

function confermaOCR() {

    const valore =
        document
            .getElementById(
                'ocrAddressInput'
            )
            .value
            .trim();


    if (!valore) {

        alert(
            'Inserisci o correggi l\'indirizzo prima di confermare.'
        );

        return;

    }


    document
        .getElementById('indirizzo')
        .value = valore;


    chiudiOCR();


    /* 
       Dopo la conferma viene
       automaticamente aggiunta
       la consegna alla lista.
    */

    aggiungiTappa();

}


/* ================================================= */
/* AGGIUNGI TAPPA                                    */
/* ================================================= */

async function aggiungiTappa() {

    let com =
        comuneSelezionato ||
        document
            .getElementById('comune')
            .value
            .trim();


    const indInput =
        document
            .getElementById('indirizzo')
            .value
            .trim();


    const noteInput =
        document
            .getElementById('note')
            .value
            .trim();


    if (!com || !indInput) {

        alert(
            "Inserisci sia il comune che l'indirizzo!"
        );

        return;

    }


    const indirizzoCompleto =
        `${indInput}, ${com}`;


    let lat = null;

    let lng = null;


    const place =
        autocompleteInd
            ?
            autocompleteInd.getPlace()
            :
            null;


    if (
        place &&
        place.geometry &&
        place.geometry.location
    ) {

        lat =
            place.geometry.location.lat();

        lng =
            place.geometry.location.lng();

    }

    else {

        const coords =
            await geocodeAddress(
                indirizzoCompleto
            );


        if (coords) {

            lat = coords.lat;

            lng = coords.lng;

        }

    }


    tappe.push({

        indirizzo:
            indirizzoCompleto,

        note:
            noteInput,

        cliccata:
            false,

        fatta:
            false,

        selezionata:
            false,

        lat:
            lat,

        lng:
            lng

    });


    document
        .getElementById('indirizzo')
        .value = '';


    document
        .getElementById('note')
        .value = '';


    render();

}


/* ================================================= */
/* RENDER LISTA                                      */
/* ================================================= */

function render() {

    const list =
        document.getElementById('lista');

    const batchBar =
        document.getElementById('batch-bar');


    list.innerHTML = '';


    if (tappe.length > 0) {

        batchBar.style.display =
            'flex';

    }

    else {

        batchBar.style.display =
            'none';

        document
            .getElementById(
                'seleziona-tutti'
            )
            .checked = false;

    }


    tappe.forEach(
        (t, i) => {

            let classeStato = '';


            if (t.fatta) {

                classeStato =
                    'fatta';

            }

            else if (t.cliccata) {

                classeStato =
                    'evidenziata';

            }


            list.innerHTML += `

                <div
                    class="tappa ${classeStato}"
                    onclick="apriNavigatore(${i})"
                >

                    <div class="tappa-left">

                        <div class="tappa-text">

                            <input
                                type="checkbox"
                                ${t.selezionata ? 'checked' : ''}
                                onclick="event.stopPropagation(); toggleSelezionaTappa(${i}, this)"
                            >

                            <span>
                                <strong>
                                    ${i + 1}.
                                </strong>

                                ${t.indirizzo}
                            </span>

                        </div>

                        ${
                            t.note
                            ?
                            `<span class="tappa-note">
                                📝 ${t.note}
                            </span>`
                            :
                            ''
                        }

                    </div>

                    <button
                        class="btn-del"
                        onclick="event.stopPropagation(); rimuoviTappa(${i})"
                    >
                        X
                    </button>

                </div>

            `;

        }
    );


    aggiornaPulsanteGuida();

}


/* ================================================= */
/* SELEZIONE TAPPE                                   */
/* ================================================= */

function toggleSelezionaTappa(
    i,
    checkbox
) {

    tappe[i].selezionata =
        checkbox.checked;


    const tuttiSelezionati =
        tappe.length > 0 &&
        tappe.every(
            t => t.selezionata
        );


    document
        .getElementById(
            'seleziona-tutti'
        )
        .checked =
            tuttiSelezionati;

}


function toggleSelezionaTutti(
    checkbox
) {

    const stato =
        checkbox.checked;


    tappe.forEach(
        t =>
            t.selezionata =
                stato
    );


    render();

}


/* ================================================= */
/* FATTA                                           */
/* ================================================= */

function toggleFattaSelezionate() {

    const selezionate =
        tappe.filter(
            t => t.selezionata
        );


    if (
        selezionate.length === 0
    ) {

        alert(
            "Seleziona almeno una tappa."
        );

        return;

    }


    const tutteFatte =
        selezionate.every(
            t => t.fatta
        );


    selezionate.forEach(
        t => {

            t.fatta =
                !tutteFatte;


            if (!tutteFatte) {

                t.cliccata =
                    false;

            }

        }
    );


    render();

}


/* ================================================= */
/* EVIDENZIA                                        */
/* ================================================= */

function toggleEvidenziaSelezionate() {

    const selezionate =
        tappe.filter(
            t => t.selezionata
        );


    if (
        selezionate.length === 0
    ) {

        alert(
            "Seleziona almeno una tappa."
        );

        return;

    }


    const tutteEvidenziate =
        selezionate.every(
            t => t.cliccata
        );


    selezionate.forEach(
        t => {

            t.cliccata =
                !tutteEvidenziate;

        }
    );


    render();

}


/* ================================================= */
/* ELIMINA                                          */
/* ================================================= */

function eliminaSelezionate() {

    const daEliminare =
        tappe.filter(
            t => t.selezionata
        ).length;


    if (
        daEliminare === 0
    ) {

        alert(
            "Seleziona almeno una tappa."
        );

        return;

    }


    if (
        confirm(
            `Vuoi eliminare ${daEliminare} tappe?`
        )
    ) {

        tappe =
            tappe.filter(
                t => !t.selezionata
            );


        document
            .getElementById(
                'seleziona-tutti'
            )
            .checked = false;


        render();

    }

}


/* ================================================= */
/* RIMUOVI TAPPA                                    */
/* ================================================= */

function rimuoviTappa(i) {

    tappe.splice(
        i,
        1
    );

    render();

}


/* ================================================= */
/* NAVIGATORE                                       */
/* ================================================= */

function apriNavigatore(i) {

    if (
        tappe[i].fatta
    ) {

        return;

    }


    tappe[i].cliccata =
        true;


    render();


    const url =
        `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(tappe[i].indirizzo)}&travelmode=driving`;


    window.open(
        url,
        '_blank'
    );

}


/* ================================================= */
/* DISTANZA                                         */
/* ================================================= */

function calcolaDistanza(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371;


    const dLat =
        (lat2 - lat1) *
        Math.PI /
        180;


    const dLon =
        (lon2 - lon1) *
        Math.PI /
        180;


    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(
            lat1 * Math.PI / 180
        ) *

        Math.cos(
            lat2 * Math.PI / 180
        ) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);


    return R *
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

}


/* ================================================= */
/* OTTIMIZZA GIRO                                   */
/* ================================================= */

async function ottimizzaGiro() {

    if (
        tappe.length === 0
    ) {

        alert(
            "Aggiungi almeno una via!"
        );

        return;

    }


    if (
        !navigator.geolocation
    ) {

        alert(
            "GPS non supportato."
        );

        return;

    }


    navigator.geolocation.getCurrentPosition(

        async (pos) => {

            const userLat =
                pos.coords.latitude;


            const userLng =
                pos.coords.longitude;


            let nonFatte =
                tappe.filter(
                    t => !t.fatta
                );


            if (
                nonFatte.length === 0
            ) {

                alert(
                    "Tutte le tappe sono state completate!"
                );

                return;

            }


            for (
                let t of nonFatte
            ) {

                if (
                    t.lat === null ||
                    t.lng === null
                ) {

                    const coords =
                        await geocodeAddress(
                            t.indirizzo
                        );


                    if (coords) {

                        t.lat =
                            coords.lat;

                        t.lng =
                            coords.lng;

                    }

                }

            }


            nonFatte.sort(
                (a, b) => {

                    const distA =
                        (
                            a.lat &&
                            a.lng
                        )
                        ?
                        calcolaDistanza(
                            userLat,
                            userLng,
                            a.lat,
                            a.lng
                        )
                        :
                        99999;


                    const distB =
                        (
                            b.lat &&
                            b.lng
                        )
                        ?
                        calcolaDistanza(
                            userLat,
                            userLng,
                            b.lat,
                            b.lng
                        )
                        :
                        99999;


                    return distA - distB;

                }
            );


            tappe =
                [
                    ...nonFatte,
                    ...tappe.filter(
                        t => t.fatta
                    )
                ];


            render();

        },

        () => {

            alert(
                "Impossibile ottenere la posizione."
            );

        }

    );

}


/* ================================================= */
/* PULSANTE GUIDA                                   */
/* ================================================= */

function aggiornaPulsanteGuida() {

    const btn =
        document.getElementById(
            'btn-guided'
        );


    btn.style.display =
        tappe.length > 0
        ?
        'block'
        :
        'none';

}


/* ================================================= */
/* INIZIA GIRO                                      */
/* ================================================= */

function avanzaiGiro() {

    const prossima =
        tappe.find(
            t => !t.fatta
        );


    if (prossima) {

        const index =
            tappe.indexOf(
                prossima
            );


        apriNavigatore(
            index
        );

    }

    else {

        alert(
            "Giro terminato!"
        );

    }

}

</script>
