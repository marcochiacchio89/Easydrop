<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyDrop PRO v2.5</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAtVYWeIyin713t6mQOUhz3f7NnDS-CCvI&libraries=places&callback=initAutocomplete" async defer></script>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; margin: 0; padding: 15px; }
        .container { max-width: 480px; margin: auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-top: 10px; }
        
        .input-group { position: relative; display: flex; align-items: center; }
        .input-group input { width: 100%; padding: 12px; padding-right: 35px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .btn-clear { position: absolute; right: 10px; background: #e0e0e0; border: none; border-radius: 50%; width: 22px; height: 22px; font-weight: bold; color: #555; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        
        .suggerimenti-box { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #ccc; border-radius: 0 0 6px 6px; z-index: 1000; max-height: 220px; overflow-y: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: none; }
        .suggerimento-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 14px; color: #333; }
        .suggerimento-item:hover { background: #f0f8ff; }
        .suggerimento-item:last-child { border-bottom: none; }

        select { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        
        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; text-align: center; color: white; }
        .btn-add { background: #28a745; width: 100%; margin-top: 10px; font-size: 15px; padding: 14px; }
        .btn-opt { background: #17a2b8; }
        .btn-store { background: #e83e8c; }
        .btn-guided { background: #ff9800; color: white; display: none; font-size: 16px; width: 100%; box-shadow: 0 3px 6px rgba(0,0,0,0.2); margin-top: 15px; padding: 14px; }
        
        .master-checkbox-container { background: #e9ecef; padding: 10px; border-radius: 6px; margin-top: 15px; display: flex; align-items: center; font-weight: bold; font-size: 14px; cursor: pointer; }
        .master-checkbox-container input { transform: scale(1.4); margin-right: 10px; cursor: pointer; accent-color: #007bff; }

        .tappa { display: flex; align-items: center; padding: 10px; margin-bottom: 8px; border-radius: 6px; background: #f8f9fa; border-left: 5px solid #007bff; gap: 6px; }
        .tappa-info { flex-grow: 1; cursor: pointer; }
        .nota-badge { font-size: 12px; color: #666; font-style: italic; margin-top: 3px; display: block; }
        .orari-badge { font-size: 12px; color: #dc3545; font-weight: bold; margin-top: 3px; display: block; background: #ffebeb; padding: 2px 4px; border-radius: 4px; display: inline-block;}
        .evidenziata { background: #fff3cd; border-left-color: #ffc107; }
        .fatta { background: #d4edda; border-left-color: #28a745; text-decoration: line-through; color: #6c757d; opacity: 0.7; }
        
        .btn-icon { background: #6c757d; color: white; border: none; padding: 6px; border-radius: 4px; cursor: pointer; font-size: 12px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
        .btn-del { background: #dc3545; }
        .btn-move { background: #007bff; }
        .btn-move:disabled { background: #b8c4d1; cursor: not-allowed; }
        .checkbox-fatta { transform: scale(1.5); margin-right: 6px; cursor: pointer; accent-color: #28a745; }
    </style>
</head>
<body>
<div class="container">
    <h2>EasyDrop PRO 📦 v2.5</h2>
    
    <label>Ditta:</label>
    <select id="ditta">
        <option>SDA</option>
        <option>BRT</option>
        <option>Poste Italiane</option>
        <option>GLS</option>
    </select>

    <label>Comune:</label>
    <div class="input-group">
        <input type="text" id="comune" placeholder="Inizia a scrivere il comune...">
        <button class="btn-clear" onclick="pulisciCampo('comune')">✕</button>
    </div>

    <label>Indirizzo (o nome negozio):</label>
    <div class="input-group">
        <input type="text" id="indirizzo" placeholder="Seleziona prima il comune..." autocomplete="off" oninput="cercaVie()">
        <button class="btn-clear" onclick="pulisciCampo('indirizzo')">✕</button>
        <div id="indirizzo-suggerimenti" class="suggerimenti-box"></div>
    </div>

    <label>Note (facoltativo):</label>
    <div class="input-group">
        <input type="text" id="note" placeholder="es. Pacco, Busta, Suonare 2° piano...">
        <button class="btn-clear" onclick="pulisciCampo('note')">✕</button>
    </div>

    <button class="btn btn-add" onclick="aggiungiTappa()">+ Aggiungi Tappa</button>
    
    <div class="btn-row">
        <button class="btn btn-opt" onclick="ottimizzaGiro()">📍 Mappa GPS</button>
        <button class="btn btn-store" onclick="ottimizzaNegozi()">🏪 Precedenza Negozi</button>
    </div>

    <button id="btn-guided" class="btn btn-guided" onclick="avanziaGiro()">🚀 INIZIA GIRO</button>

    <div class="master-checkbox-container" id="master-toggle-container" style="display: none;">
        <input type="checkbox" id="master-checkbox" onchange="toggleTutte(this.checked)">
        <label for="master-checkbox" style="margin:0; cursor:pointer;">Seleziona / Deseleziona Tutte</label>
    </div>

    <div id="lista" style="margin-top: 15px;"></div>
</div>

<script>
    let tappe = [];
    let geocoder;
    let autocompleteComune;
    let autocompleteService;
    let placesService;
    let giroIniziato = false;
    
    let tempIsBusiness = false;
    let tempOrari = "";

    function initAutocomplete() {
        geocoder = new google.maps.Geocoder();
        autocompleteService = new google.maps.places.AutocompleteService();
        placesService = new google.maps.places.PlacesService(document.createElement('div'));
        
        autocompleteComune = new google.maps.places.Autocomplete(
            document.getElementById('comune'), 
            { types: ['(cities)'], componentRestrictions: { country: 'it' } }
        );
        
        autocompleteComune.addListener('place_changed', function() {
            const place = autocompleteComune.getPlace();
            if (place && place.name) {
                document.getElementById('indirizzo').value = '';
                document.getElementById('indirizzo').placeholder = "Cerca via o negozio a " + place.name + "...";
                document.getElementById('indirizzo-suggerimenti').style.display = 'none';
            }
        });

        document.addEventListener('click', function(event) {
            if (event.target.id !== 'indirizzo') {
                document.getElementById('indirizzo-suggerimenti').style.display = 'none';
            }
        });

        caricaDaLocalStorage();
        render();
    }

    function cercaVie() {
        const inputVia = document.getElementById('indirizzo').value;
        const nomeComune = document.getElementById('comune').value;
        const suggerimentiBox = document.getElementById('indirizzo-suggerimenti');

        tempIsBusiness = false;
        tempOrari = "";

        if (inputVia.length < 2 || !nomeComune) {
            suggerimentiBox.style.display = 'none';
            return;
        }

        const queryForte = inputVia + ", " + nomeComune;

        autocompleteService.getPlacePredictions({
            input: queryForte,
            componentRestrictions: { country: 'it' }
        }, function(predictions, status) {
            if (status !== google.maps.places.PlacesServiceStatus.OK || !predictions) {
                suggerimentiBox.style.display = 'none';
                return;
            }

            suggerimentiBox.innerHTML = '';
            predictions.forEach(p => {
                const div = document.createElement('div');
                div.className = 'suggerimento-item';
                div.innerHTML = p.description;
                
                div.onclick = function() {
                    document.getElementById('indirizzo').value = p.structured_formatting.main_text;
                    suggerimentiBox.style.display = 'none';
                    
                    try {
                        placesService.getDetails({ placeId: p.place_id, fields: ['types', 'opening_hours'] }, function(placeDetails, statusDetails) {
                            if (statusDetails === google.maps.places.PlacesServiceStatus.OK && placeDetails) {
                                if (placeDetails.types && (placeDetails.types.includes('establishment') || placeDetails.types.includes('store'))) {
                                    tempIsBusiness = true;
                                    if (placeDetails.opening_hours && placeDetails.opening_hours.weekday_text) {
                                        let todayIndex = (new Date().getDay() + 6) % 7; 
                                        let stringaOggi = placeDetails.opening_hours.weekday_text[todayIndex];
                                        if(stringaOggi) {
                                            tempOrari = stringaOggi.split(': ')[1];
                                        }
                                    }
                                }
                            }
                        });
                    } catch (err) {
                        console.log("Dettagli negozio non disponibili");
                    }
                };
                suggerimentiBox.appendChild(div);
            });
            suggerimentiBox.style.display = 'block';
        });
    }

    function pulisciCampo(id) {
        document.getElementById(id).value = '';
        if (id === 'comune') {
            document.getElementById('indirizzo').value = '';
            document.getElementById('indirizzo').placeholder = "Seleziona prima il comune...";
        }
        document.getElementById('indirizzo-suggerimenti').style.display = 'none';
        tempIsBusiness = false;
        tempOrari = "";
    }

    function salvaInLocalStorage() {
        localStorage.setItem('easydrop_tappe_v3', JSON.stringify(tappe));
    }

    function caricaDaLocalStorage() {
        const dati = localStorage.getItem('easydrop_tappe_v3');
        if (dati) {
            try { tappe = JSON.parse(dati); } catch (e) { tappe = []; }
        }
    }

    function aggiungiTappa() {
        const com = document.getElementById('comune').value.trim();
        const ind = document.getElementById('indirizzo').value.trim();
        const note = document.getElementById('note').value.trim();

        if (!com || !ind) {
            alert("Inserisci sia il comune che l'indirizzo/negozio!");
            return;
        }

        const indirizzoCompleto = `${ind}, ${com}`;
        
        tappe.push({
            indirizzo: indirizzoCompleto,
            note: note,
            cliccata: false,
            fatta: false,
            lat: null,
            lng: null,
            isBusiness: tempIsBusiness,
            orari: tempOrari
        });
        
        document.getElementById('indirizzo').value = '';
        document.getElementById('note').value = '';
        tempIsBusiness = false;
        tempOrari = "";
        
        salvaInLocalStorage();
        render();
    }

    function toggleFatta(i) {
        tappe[i].fatta = !tappe[i].fatta;
        salvaInLocalStorage();
        render();
    }

    function toggleTutte(stato) {
        tappe.forEach(t => t.fatta = stato);
        salvaInLocalStorage();
        render();
    }

    function spostaTappa(index, direzione) {
        if (index + direzione < 0 || index + direzione >= tappe.length) return;
        let temp = tappe[index];
        tappe[index] = tappe[index + direzione];
        tappe[index + direzione] = temp;
        salvaInLocalStorage();
        render();
    }

    function modificaTappa(i) {
        const nuovoIndirizzo = prompt("Modifica Indirizzo e Comune:", tappe[i].indirizzo);
        if (nuovoIndirizzo === null) return;
        const nuoveNote = prompt("Modifica Note:", tappe[i].note || "");
        if (nuoveNote === null) return;

        tappe[i].indirizzo = nuovoIndirizzo.trim();
        tappe[i].note = nuoveNote.trim();
        tappe[i].lat = null;
        tappe[i].lng = null;

        salvaInLocalStorage();
        render();
    }

    function render() {
        const list = document.getElementById('lista');
        const masterToggle = document.getElementById('master-toggle-container');
        list.innerHTML = '';

        if (tappe.length > 0) {
            masterToggle.style.display = 'flex';
            document.getElementById('master-checkbox').checked = tappe.every(t => t.fatta);
        } else {
            masterToggle.style.display = 'none';
        }

        tappe.forEach((t, i) => {
            let classeStato = '';
            if (t.fatta) classeStato = 'fatta';
            else if (t.cliccata) classeStato = 'evidenziata';

            list.innerHTML += `
                <div class="tappa ${classeStato}">
                    <input type="checkbox" class="checkbox-fatta" ${t.fatta ? 'checked' : ''} onchange="toggleFatta(${i})">
                    <div class="tappa-info" onclick="apriNavigatore(${i})">
                        <strong>${i + 1}.</strong> ${t.indirizzo}
                        ${t.isBusiness ? `<span class="orari-badge">🏪 Orari oggi: ${t.orari ? t.orari : 'Non specificati'}</span>` : ''}
                        ${t.note ? `<span class="nota-badge">📝 ${t.note}</span>` : ''}
                    </div>
                    <button class="btn-icon btn-move" onclick="spostaTappa(${i}, -1)" ${i === 0 ? 'disabled' : ''} title="Sposta Su">🔼</button>
                    <button class="btn-icon btn-move" onclick="spostaTappa(${i}, 1)" ${i === tappe.length - 1 ? 'disabled' : ''} title="Sposta Giù">🔽</button>
                    <button class="btn-icon btn-del" onclick="rimuoviTappa(${i})" title="Elimina">✕</button>
                </div>`;
        });

        aggiornaPulsanteGuida();
    }

    function rimuoviTappa(i) {
        tappe.splice(i, 1);
        salvaInLocalStorage();
        render();
    }

    function apriNavigatore(i) {
        if (tappe[i].fatta) return;
        tappe[i].cliccata = true;
        salvaInLocalStorage();
        render();
        const url = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(tappe[i].indirizzo)}&travelmode=driving`;
        window.open(url, '_blank');
        setTimeout(() => {
            if (confirm(`Consegna effettuata per:\n${tappe[i].indirizzo}?`)) {
                tappe[i].fatta = true;
                salvaInLocalStorage();
                render();
            }
        }, 1000);
    }

    function calcolaDistanza(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function geocodeAddress(address) {
        return new Promise((resolve) => {
            geocoder.geocode({ address: address }, (results, status) => {
                if (status === 'OK' && results && results[0]) {
                    resolve({ lat: results[0].geometry.location.lat(), lng: results[0].geometry.location.lng() });
                } else resolve(null);
            });
        });
    }

    async function assegnaCoordinateMancanti() {
        for (let t of tappe) {
            if (t.lat === null || t.lng === null) {
                const coords = await geocodeAddress(t.indirizzo);
                if (coords) { t.lat = coords.lat; t.lng = coords.lng; }
            }
        }
    }

    async function ottimizzaGiro() {
        if (tappe.length === 0) return alert("Aggiungi almeno una via!");
        if (!navigator.geolocation) return alert("GPS non supportato.");

        navigator.geolocation.getCurrentPosition(async (pos) => {
            await assegnaCoordinateMancanti();
            
            let tappeDaFare = tappe.filter(t => !t.fatta);
            let tappeFatte = tappe.filter(t => t.fatta);
            
            let percorsoOttimizzato = [];
            let currentLat = pos.coords.latitude;
            let currentLng = pos.coords.longitude;
            
            while(tappeDaFare.length > 0) {
                let nearestIndex = 0;
                let minDist = 99999;
                
                for(let i = 0; i < tappeDaFare.length; i++) {
                    let d = tappeDaFare[i].lat ? calcolaDistanza(currentLat, currentLng, tappeDaFare[i].lat, tappeDaFare[i].lng) : 99999;
                    if(d < minDist) {
                        minDist = d;
                        nearestIndex = i;
                    }
                }
                
                let nextStop = tappeDaFare.splice(nearestIndex, 1)[0];
                percorsoOttimizzato.push(nextStop);
                
                if(nextStop.lat) {
                    currentLat = nextStop.lat;
                    currentLng = nextStop.lng;
                }
            }
            
            tappe = percorsoOttimizzato.concat(tappeFatte);
            
            giroIniziato = false; salvaInLocalStorage(); render();
            alert("Mappa GPS ricalcolata in successione logica a catena!");
        }, () => alert("Attiva il GPS!"));
    }

            let tappeNegozi = tappe.filter(t => !t.fatta && t.isBusiness);
