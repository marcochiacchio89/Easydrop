<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyDrop - Corrieri</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-add { background: #28a745; color: white; }
        .btn-save { background: #0056b3; color: white; }
    </style>
</head>
<body>
<div class="container">
    <h2>EasyDrop 📦</h2>
    <select id="ditta"><option>SDA</option><option>Poste Italiane</option><option>Bartolini</option></select>
    <input type="text" id="comune" placeholder="Comune di lavoro">
    <input type="text" id="indirizzo_input" placeholder="Aggiungi indirizzo">
    <button class="btn-add" onclick="aggiungi()">+ Aggiungi Indirizzo</button>
    <ul id="lista"></ul>
    <button class="btn-save" onclick="inviaAlDatabase()">🚀 Salva nel Cloud</button>
</div>

<script>
    const supabase = supabase.createClient('https://jfhejqhxtvhgfrjdfleq.supabase.co', 'sb_publishable_9VhqQ9KOTrhqnMuZH9_L8Q_u7s5zEXh');
    let tappe = [];

    function aggiungi() {
        const ind = document.getElementById('indirizzo_input');
        if(ind.value) {
            tappe.push(ind.value);
            document.getElementById('lista').innerHTML += `<li>${ind.value}</li>`;
            ind.value = '';
        }
    }

    async function inviaAlDatabase() {
        const ditta = document.getElementById('ditta').value;
        const comune = document.getElementById('comune').value;
        
        const { error } = await supabase.from('Consegne').insert({ 
            ditta: ditta, 
            comune: comune, 
            indirizzi: JSON.stringify(tappe) 
        });

        if(error) alert("Errore: " + error.message);
        else alert("Giro salvato con successo!");
    }
</script>
</body>
</html>
