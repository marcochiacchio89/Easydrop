<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyDrop - Gestione Consegne & Scan Etichette</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; max-width: 600px; margin: 0 auto; }
        h1 { font-size: 1.4rem; margin-bottom: 15px; text-align: center; color: var(--primary); }
        .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
        input[type="text"], input[type="file"] { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; margin-bottom: 10px; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; background: var(--primary); color: white; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; }
        button:hover { background: var(--primary-hover); }
        button.secondary { background: #64748b; }
        button.danger { background: #ef4444; }
        #map { width: 100%; height: 250px; border-radius: 8px; margin-top: 10px; }
        .stop-list { list-style: none; margin-top: 10px; }
        .stop-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border); }
        .stop-item:last-child { border-bottom: none; }
        .loading { display: none; text-align: center; color: var(--primary); font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>

    <h1>EasyDrop - Delivery & OCR Scan</h1>

    <div class="card">
        <label for="addressInput">📍 Indirizzo o Scansione Etichetta</label>
        <input type="text" id="addressInput" placeholder="Inserisci o seleziona indirizzo...">
        
        <label for="cameraInput">📷 Scansiona Etichetta Pacco</label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment">

        <div id="loading" class="loading">⏳ Lettura etichetta / elaborazione in corso...</div>

        <div class="btn-group" style="margin-top: 10px;">
            <button onclick="addStop()">Aggiungi Fermata</button>
        </div>
    </div>

    <div class="card">
        <h3>🗺️ Mappa Itinerario</h3>
        <div id="map"></div>
    </div>

    <div class="card">
        <h3>📦 Lista Fermate</h3>
        <ul id="stopList" class="stop-list"></ul>
        <div class="btn-group" style="margin-top: 15px;">
            <button class="danger" onclick="clearStops()">Svuota Lista</button>
        </div>
    </div>

    <script>
        // =========================================================================
        // 🔑 INSERISCI LA TUA CHIAVE API GOOGLE QUI (UNICO PUNTO IN TUTTO IL CODICE)
        // =========================================================================
        const API_KEY_GOOGLE = "AIzaSyAtVYWeIyin713t6mQOUhz3f7NnDS-CCvI";
        // =========================================================================

        let map, autocomplete, directionsService, directionsRenderer;
        let stops = [];

        // Caricamento dinamico dello script Google Maps
        function loadGoogleMapsScript() {
            if (!API_KEY_GOOGLE || API_KEY_GOOGLE === "INSERISCI_LA_TUA_CHIAVE_API_QUI") {
                alert("⚠️ ATTENZIONE: Inserisci la tua API Key all'inizio del codice nella variabile 'const API_KEY_GOOGLE'!");
                return;
            }
            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${API_KEY_GOOGLE}&libraries=places&callback=initMap`;
            script.async = true;
            script.defer = true;
            script.onerror = () => alert("Errore nel caricamento di Google Maps. Verifica che l'API Key sia corretta e attiva.");
            document.head.appendChild(script);
        }

        // Inizializzazione Mappa e Autocomplete
        function initMap() {
            const defaultCenter = { lat: 40.963, lng: 14.288 }; // Caserta / Marcianise
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 12,
                center: defaultCenter,
            });

            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer();
            directionsRenderer.setMap(map);

            const input = document.getElementById("addressInput");
            autocomplete = new google.maps.places.Autocomplete(input);
            autocomplete.bindTo("bounds", map);
        }

        // Gestione OCR Cloud Vision
        document.getElementById('cameraInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (!API_KEY_GOOGLE || API_KEY_GOOGLE === "INSERISCI_LA_TUA_CHIAVE_API_QUI") {
                alert("Inserisci prima la tua API Key nella variabile in alto!");
                return;
            }

            showLoading(true);
            try {
                const base64Image = await convertBase64(file);
                const cleanedBase64 = base64Image.replace(/^data:image\/(png|jpg|jpeg);base64,/, "");

                const response = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=${API_KEY_GOOGLE}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        requests: [{
                            image: { content: cleanedBase64 },
                            features: [{ type: 'TEXT_DETECTION' }]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.responses && data.responses[0] && data.responses[0].fullTextAnnotation) {
                    const detectedText = data.responses[0].fullTextAnnotation.text;
                    document.getElementById('addressInput').value = extractAddress(detectedText);
                } else {
                    alert("Nessun testo letto con chiarezza sull'etichetta.");
                }
            } catch (err) {
                console.error(err);
                alert("Errore nella lettura della foto con la Cloud Vision API.");
            } finally {
                showLoading(false);
            }
        });

        function convertBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function extractAddress(text) {
            const lines = text.split('\n').filter(line => line.trim().length > 3);
            return lines.slice(0, 3).join(' ');
        }

        function addStop() {
            const input = document.getElementById("addressInput");
            const val = input.value.trim();
            if (!val) return;

            stops.push(val);
            input.value = "";
            renderStops();
            updateRoute();
        }

        function renderStops() {
            const list = document.getElementById("stopList");
            list.innerHTML = "";
            stops.forEach((stop, idx) => {
                const li = document.createElement("li");
                li.className = "stop-item";
                li.innerHTML = `<span><b>${idx + 1}.</b> ${stop}</span> <button class="secondary" style="padding: 4px 8px; flex: initial;" onclick="removeStop(${idx})">❌</button>`;
                list.appendChild(li);
            });
        }

        function removeStop(idx) {
            stops.splice(idx, 1);
            renderStops();
            updateRoute();
        }

        function clearStops() {
            stops = [];
            renderStops();
            if (directionsRenderer) directionsRenderer.setDirections({ routes: [] });
        }

        function updateRoute() {
            if (stops.length < 2 || !directionsService) return;
            
            const waypoints = stops.slice(1, -1).map(s => ({ location: s, stopover: true }));
            directionsService.route({
                origin: stops[0],
                destination: stops[stops.length - 1],
                waypoints: waypoints,
                optimizeWaypoints: true,
                travelMode: google.maps.TravelMode.DRIVING
            }, (result, status) => {
                if (status === 'OK') {
                    directionsRenderer.setDirections(result);
                }
            });
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        // Inizio caricamento automatico
        loadGoogleMapsScript();
    </script>
</body>
</html>
