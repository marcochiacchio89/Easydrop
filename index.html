<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyDrop - Gestione Consegne</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; padding: 15px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 12px; margin: 6px 0 12px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 16px; }
        .btn-add { background: #28a745; color: white; }
        .btn-save { background: #0056b3; color: white; margin-top: 15px; }
        ul { padding-left: 0; list-style: none; margin-top: 15px; }
        li { background: #f8f9fa; padding: 10px 12px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #e9ecef; display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
        .map-link { background: #ffc107; color: #000; padding: 6px 10px; border-radius: 4px; text-decoration: none; font-size: 13px; font-weight: bold; white-space: nowrap; margin-left: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h2>EasyDrop 📦</h2>
    
    <label for="ditta">Seleziona Ditta:</label>
    <select id="ditta">
        <option>SDA</option>
        <option>Bartolini (BRT)</option>
        <option>Poste Italiane</option>
        <option>GLS</option>
        <option>FedEx</option>
        <option>UPS</option>
    </select>

    <label for="comune">Comune di lavoro:</label>
    <input type="text" id="comune" list="comuni-list" placeholder="Digita o seleziona comune...">
    <datalist id="comuni-list">
        <option value="Sant'Arpino (CE)">
        <option value="Succivo (CE)">
        <option value="Orta di Atella (CE)">
        <option value="Gricignano di Aversa (CE)">
        <option value="Aversa (CE)">
        <option value="Cesa (CE)">
        <option value="Frattaminore (NA)">
        <option value="Frattamaggiore (NA)">
        <option value="Grumo Nevano (NA)">
        <option value="Sant'Antimo (NA)">
        <option value="Marcianise (CE)">
    </datalist>

    <label for="indirizzo_input">Aggiungi Indirizzo:</label>
    <input type="text" id="indirizzo_input" list="strade-list" placeholder="Es. Via Roma">
    <datalist id="strade-list">
        <option value="Via Fratelli Cervi">
        <option value="Via Roma">
        <option value="Via Diaz">
        <option value="Corso Umberto I">
        <option value="Via Matteotti">
        <option value="Via Garibaldi">
    </datalist>
    
    <button class="btn-add" onclick="aggiungi()">+ Aggiungi Indirizzo</button>
    
    <ul id="lista"></ul>
    
    <button class="btn-save" onclick="inviaAlDatabase()">🚀 Salva nel Cloud</button>
</div>

<script>
    const SUPABASE_URL = 'https://jfhejqhxtvhgfrjdfleq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_9VhqQ9KOTrhqnMuZH9_L8Q_u7s5zEXh';
    let tappe = [];

    function aggiungi() {
        const ind = document.getElementById('indirizzo_input');
        const comuneInput = document.getElementById('comune').value.trim();
        
        if(ind.value.trim() !== "") {
            let indirizzoCompleto = ind.value.trim();
            if(comuneInput) {
                indirizzoCompleto += " (" + comuneInput + ")";
            }
            
            tappe.push(indirizzoCompleto);
            aggiornaListaVisuale();
            ind.value = '';
        } else {
            alert("Inserisci un indirizzo valido!");
        }
    }

    function aggiornaListaVisuale() {
        const lista = document.getElementById('lista');
        lista.innerHTML = '';
        tappe.forEach((tappa, index) => {
            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(tappa)}`;
            lista.innerHTML += `<li>
                <span>${index + 1}. ${tappa}</span>
                <a href="${mapUrl}" target="_blank" class="map-link">📍 Mappa</a>
            </li>`;
        });
    }

    async function inviaAlDatabase() {
        const ditta = document.getElementById('ditta').value;
        const comune = document.getElementById('comune').value;

        if(tappe.length === 0) {
            alert("Aggiungi almeno un indirizzo prima di salvare!");
            return;
        }

        const indirizziStringa = tappe.join(" | ");

        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/Consegne`, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify({
                    ditta: ditta,
                    comune: comune,
                    indirizzi: indirizziStringa
                })
            });

            if (response.ok) {
                alert("Giro salvato con successo nel database!");
                tappe = [];
                document.getElementById('lista').innerHTML = '';
                document.getElementById('comune').value = '';
            } else {
                const errData = await response.json();
                alert("Errore dal server: " + (errData.message || response.statusText));
            }
        } catch (error) {
            alert("Errore di connessione: " + error.message);
        }
    }
</script>
</body>
</html>
