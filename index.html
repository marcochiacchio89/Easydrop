<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyDrop PRO V 5.0</title>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAtVYWeIyin713t6mQOUhz3f7NnDS-CCvI&libraries=places"></script>
<style>
:root { --bg-body: #f4f6f9; --primary-color: #007bff; --accent: #ff9800; }
body { font-family: sans-serif; background: var(--bg-body); margin: 0; padding: 15px; }
.container { max-width: 480px; margin: auto; background: #fff; padding: 20px; border-radius: 12px; }

/* MODALITÀ UNA MANO */
.one-handed .input-section { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 10px; border-top: 2px solid #ddd; z-index: 1000; }
.one-handed .list-section { margin-bottom: 250px; }

.tappa { display: flex; align-items: center; padding: 10px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 6px; }
.tappa.ritiro { border-left: 6px solid var(--accent); background: #fffde7; }
.tappa.fatta { background: #d4edda; }
.frecce { display: flex; flex-direction: column; margin-right: 10px; }
.btn-mini { cursor: pointer; border: none; background: #eee; padding: 2px 5px; }
</style>
</head>
<body id="bodyEl">

<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="title">EasyDrop PRO V 5.0</h2>
        <button onclick="document.getElementById('menu').style.display='block'">☰</button>
    </div>

    <!-- MENU HAMBURGER -->
    <div id="menu" style="display:none; position:fixed; top:0; right:0; width:250px; height:100%; background:white; z-index:3000; padding:20px; box-shadow:-2px 0 5px rgba(0,0,0,0.2);">
        <button onclick="document.getElementById('menu').style.display='none'">Chiudi</button>
        <h3>Menu</h3>
        <select id="lang" onchange="cambiaLingua()">
            <option value="it">Italiano</option><option value="en">English</option>
            <option value="fr">Français</option><option value="de">Deutsch</option>
        </select>
        <p><button onclick="toggleOneHanded()">✋ Modalità Una Mano</button></p>
        <p>Partenza: <input type="text" id="cfg_start"></p>
        <p>Arrivo: <input type="text" id="cfg_end"></p>
    </div>

    <div class="input-section">
        <button class="btn" style="background:#6f42c1" onclick="document.getElementById('fileInput').click()">📷 Scansiona</button>
        <input type="file" id="fileInput" hidden accept="image/*" onchange="processaFoto(event)">
        
        <label>Indirizzo: <button onclick="avviaMic()">🎙️</button></label>
        <input type="text" id="indirizzo">
        <label><input type="checkbox" id="chkRitiro"> Ritiro</label>
        <input type="text" id="note" placeholder="Note">
        <button class="btn" onclick="addTappa()">Aggiungi</button>
        <button class="btn" onclick="ottimizzaGiro()">📍 Ottimizza</button>
    </div>

    <div class="list-section" id="lista"></div>
    <button id="btnStart" class="btn" onclick="inizioGiro()">Inizia Giro</button>
</div>

<div id="ocrModal" class="modal-backdrop" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:2000; padding:20px;">
    <div class="modal" style="background:white; padding:20px;">
        <h3>Conferma Indirizzo</h3>
        <div id="map-ocr" style="height:150px;"></div>
        <input type="text" id="ocrInd">
        <button onclick="confermaOCR()">✅ Conferma</button>
    </div>
</div>

<script>
let tappe = JSON.parse(localStorage.getItem('tappe')) || [];
let appCounter = parseInt(localStorage.getItem('counter')) || 1;

// LOGICA OCR (Punti 1, 2)
function estraiIndirizzoDaOCR(testo) {
    const fromTo = testo.match(/(?:TO|DESTINATARIO)[:\s]+(.*?)(?=\n|$)/i);
    if(fromTo) return fromTo[1].trim();
    return testo.split('\n')[0].trim();
}

function addTappa(indOverride = null, ritiroOverride = false) {
    const ind = indOverride || document.getElementById('indirizzo').value;
    const ritiro = ritiroOverride || document.getElementById('chkRitiro').checked;
    const note = document.getElementById('note').value;
    
    tappe.push({ id: appCounter++, indirizzo: ind, fatta: false, ritiro: ritiro, note: note });
    saveAndRender();
}

function saveAndRender() {
    localStorage.setItem('tappe', JSON.stringify(tappe));
    localStorage.setItem('counter', appCounter);
    render();
}

function render() {
    const list = document.getElementById('lista');
    list.innerHTML = '';
    tappe.forEach((t, i) => {
        list.innerHTML += `
            <div class="tappa ${t.fatta ? 'fatta' : ''} ${t.ritiro ? 'ritiro' : ''}">
                <div class="frecce">
                    <button class="btn-mini" onclick="move(${i}, -1)">▲</button>
                    <button class="btn-mini" onclick="move(${i}, 1)">▼</button>
                </div>
                <div style="flex:1">
                    <strong>#${t.id}</strong> - ${t.indirizzo} ${t.ritiro ? '<br><small>RITIRO</small>' : ''}
                </div>
                <input type="checkbox" ${t.fatta ? 'checked' : ''} onchange="toggleFatta(${i})">
                <button onclick="editTappa(${i})">✏️</button>
                <button onclick="delTappa(${i})">🗑️</button>
            </div>
        `;
    });
}

function move(i, dir) {
    const target = i + dir;
    if(target >= 0 && target < tappe.length) {
        [tappe[i], tappe[target]] = [tappe[target], tappe[i]];
        saveAndRender();
    }
}

function toggleFatta(i) {
    tappe[i].fatta = !tappe[i].fatta;
    document.getElementById('btnStart').innerText = tappe.some(t => !t.fatta) ? "Effettua Prossima" : "Giro Finito";
    saveAndRender();
}

function delTappa(i) { if(confirm("Eliminare?")) { tappe.splice(i, 1); saveAndRender(); } }

function toggleOneHanded() { document.getElementById('bodyEl').classList.toggle('one-handed'); }

// Init Autocomplete
window.onload = () => {
    new google.maps.places.Autocomplete(document.getElementById('indirizzo'));
    new google.maps.places.Autocomplete(document.getElementById('ocrInd'));
    render();
};
</script>
</body>
</html>
