<body>

<script>


/* =====================================================
   VARIABILI
===================================================== */

let tappe = [];

let geocoder = null;

let AutocompleteSuggestionClass = null;

let AutocompleteSessionTokenClass = null;

let comuneToken = null;

let indirizzoToken = null;

let apiPronta = false;

let ottimizzazioneInCorso = false;

let ultimaRichiestaComune = 0;

let ultimaRichiestaVia = 0;


const STORAGE_KEY =
    "easydrop_tappe_v23";


/* =====================================================
   ERRORI API
===================================================== */

function mostraErroreApi(messaggio) {

    const box =
        document.getElementById(
            "errore-api"
        );

    box.textContent =
        messaggio;

    box.style.display =
        "block";
}


function nascondiErroreApi() {

    const box =
        document.getElementById(
            "errore-api"
        );

    box.textContent =
        "";

    box.style.display =
        "none";
}


/* =====================================================
   AVVIO GOOGLE MAPS
===================================================== */

async function initEasyDrop() {

    try {

        /*
         * IMPORTANTE:
         * AutocompleteSessionToken appartiene
         * alla libreria PLACES.
         */

        const [
            geocodingLibrary,
            placesLibrary
        ] = await Promise.all([

            google.maps.importLibrary(
                "geocoding"
            ),

            google.maps.importLibrary(
                "places"
            )

        ]);


        geocoder =
            new geocodingLibrary.Geocoder();


        AutocompleteSuggestionClass =
            placesLibrary.AutocompleteSuggestion;


        AutocompleteSessionTokenClass =
            placesLibrary.AutocompleteSessionToken;


        apiPronta = true;


        nascondiErroreApi();


        inizializzaAutocomplete();


        caricaDaLocalStorage();


        normalizzaTappe();


        render();


    } catch (errore) {

        console.error(
            "Errore Google Maps:",
            errore
        );


        mostraErroreApi(

            "Google Maps non è riuscito a caricarsi. " +
            "Controlla API Key, Maps JavaScript API, " +
            "Places API (New), Geocoding API e restrizioni della chiave."

        );


        caricaDaLocalStorage();


        normalizzaTappe();


        render();

    }

}


/* =====================================================
   AUTOCOMPLETE
===================================================== */

function inizializzaAutocomplete() {

    const comune =
        document.getElementById(
            "comune"
        );


    const indirizzo =
        document.getElementById(
            "indirizzo"
        );


    comune.addEventListener(
        "input",
        debounce(
            cercaComuni,
            200
        )
    );


    comune.addEventListener(
        "focus",
        function() {

            if (
                comune.value.trim().length >= 2
            ) {

                cercaComuni();

            }

        }
    );


    indirizzo.addEventListener(
        "input",
        debounce(
            cercaVie,
            200
        )
    );


    indirizzo.addEventListener(
        "focus",
        function() {

            if (
                indirizzo.value.trim().length >= 2 &&
                comune.value.trim()
            ) {

                cercaVie();

            }

        }
    );


    indirizzo.disabled =
        !comune.value.trim();


    document.addEventListener(
        "click",
        function(event) {

            if (
                !event.target.closest(
                    "#comune"
                ) &&
                !event.target.closest(
                    "#comune-suggerimenti"
                )
            ) {

                nascondiSuggerimenti(
                    "comune-suggerimenti"
                );

            }


            if (
                !event.target.closest(
                    "#indirizzo"
                ) &&
                !event.target.closest(
                    "#indirizzo-suggerimenti"
                )
            ) {

                nascondiSuggerimenti(
                    "indirizzo-suggerimenti"
                );

            }

        }
    );

}


/* =====================================================
   DEBOUNCE
===================================================== */

function debounce(
    funzione,
    ritardo
) {

    let timer;

    return function(...args) {

        clearTimeout(timer);

        timer =
            setTimeout(
                () =>
                    funzione.apply(
                        this,
                        args
                    ),
                ritardo
            );

    };

}


/* =====================================================
   SUGGERIMENTI
===================================================== */

function nascondiSuggerimenti(id) {

    document.getElementById(
        id
    ).style.display =
        "none";

}


function mostraSuggerimenti(id) {

    document.getElementById(
        id
    ).style.display =
        "block";

}


/* =====================================================
   RICHIESTA AUTOCOMPLETE
===================================================== */

async function fetchPredictions(
    input,
    tipi,
    token
) {

    if (
        !apiPronta ||
        !AutocompleteSuggestionClass
    ) {

        return [];

    }


    const request = {

        input: input,

        includedRegionCodes: [
            "it"
        ],

        language: "it",

        region: "it",

        sessionToken: token

    };


    if (tipi) {

        request.includedPrimaryTypes =
            tipi;

    }


    const risultato =
        await AutocompleteSuggestionClass
            .fetchAutocompleteSuggestions(
                request
            );


    return (
        risultato.suggestions || []
    )
    .filter(
        suggerimento =>
            suggerimento.placePrediction
    );

}


/* =====================================================
   RICERCA COMUNI
===================================================== */

async function cercaComuni() {

    const input =
        document.getElementById(
            "comune"
        ).value.trim();


    const box =
        document.getElementById(
            "comune-suggerimenti"
        );


    if (
        input.length < 2 ||
        !apiPronta
    ) {

        nascondiSuggerimenti(
            "comune-suggerimenti"
        );

        return;

    }


    const richiesta =
        ++ultimaRichiestaComune;


    try {

        if (!comuneToken) {

            comuneToken =
                new AutocompleteSessionTokenClass();

        }


        const suggerimenti =
            await fetchPredictions(

                input,

                [
                    "locality",
                    "administrative_area_level_3",
                    "postal_town"
                ],

                comuneToken

            );


        /*
         * Se nel frattempo l'utente
         * ha scritto altro, ignoriamo
         * la vecchia risposta.
         */

        if (
            richiesta !==
            ultimaRichiestaComune
        ) {

            return;

        }


        box.innerHTML =
            "";


        if (
            !suggerimenti.length
        ) {

            nascondiSuggerimenti(
                "comune-suggerimenti"
            );

            return;

        }


        suggerimenti
            .slice(0, 8)
            .forEach(
                suggerimento => {

                    const prediction =
                        suggerimento.placePrediction;


                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "suggerimento-item";


                    div.textContent =
                        prediction.text.toString();


                    div.onclick =
                        function() {

                            selezionaComune(
                                prediction
                            );

                        };


                    box.appendChild(
                        div
                    );

                }
            );


        const footer =
            document.createElement(
                "div"
            );


        footer.className =
            "powered";


        footer.textContent =
            "Powered by Google";


        box.appendChild(
            footer
        );


        mostraSuggerimenti(
            "comune-suggerimenti"
        );


    } catch (errore) {

        console.error(
            "Errore ricerca comuni:",
            errore
        );


        nascondiSuggerimenti(
            "comune-suggerimenti"
        );

    }

}


/* =====================================================
   SELEZIONE COMUNE
===================================================== */

async function selezionaComune(
    prediction
) {

    const comuneInput =
        document.getElementById(
            "comune"
        );


    const indirizzoInput =
        document.getElementById(
            "indirizzo"
        );


    try {

        const place =
            prediction.toPlace();


        await place.fetchFields({

            fields: [
                "displayName",
                "formattedAddress",
                "location",
                "addressComponents"
            ]

        });


        let nomeComune =
            prediction.mainText
                ? prediction.mainText.toString()
                : prediction.text.toString();


        /*
         * Se Google restituisce un nome
         * più preciso nei dettagli,
         * usiamo quello.
         */

        if (
            place.displayName
        ) {

            nomeComune =
                place.displayName;

        }


        comuneInput.value =
            nomeComune;


        /*
         * Reset indirizzo.
         */

        indirizzoInput.value =
            "";


        indirizzoInput.disabled =
            false;


        indirizzoInput.placeholder =
            "Cerca via a " +
            nomeComune +
            "...";
