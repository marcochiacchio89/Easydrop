<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyDrop - Gestione Consegne</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; padding: 15px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 12px; margin: 6px 0 12px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 16px; }
        .btn-add { background: #28a745; color: white; }
        .btn-optimize { background: #17a2b8; color: white; margin-top: 10px; }
        .btn-save { background: #0056b3; color: white; margin-top: 15px; }
        .quick-btns { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
        .quick-btns button { width: auto; flex: 1; padding: 8px; font-size: 12px; background: #e9ecef; color: #333; border: 1px solid #ced4da; margin-top: 0; }
        ul { padding-left: 0; list-style: none; margin-top: 15px; }
        li { background: #f8f9fa; padding: 10px 12px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #e9ecef; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .actions { display: flex; gap: 5px; align-items: center; }
        .map-link { background: #ffc107; color: #000; padding: 6px 8px; border-radius: 4px; text-decoration: none; font-size: 12px; font-weight: bold; white-space: nowrap; }
        .btn-delete { background: #dc3545; color: white; padding: 6px 8px; border-radius: 4px; border: none; font-size: 12px; font-weight: bold; cursor: pointer; width: auto; margin-top: 0; }
    </style>
</head>
<body>
<div class="container">
    <h2>EasyDrop 📦</h2>
    
    <label for="ditta">Seleziona Ditta:</label>
    <select id="ditta">
        <option>SDA</option>
        <option>Bartolini (BRT)</option>
        <option>Poste Italiane</option>
        <option>GLS</option>
        <option>FedEx</option>
        <option>UPS</option>
    </select>

    <label for="comune">Comune di lavoro:</label>
    <input type="text" id="comune" placeholder="Es. Sant'Arpino (CE)">
    <div class="quick-btns">
        <button type="button" onclick="impostaComune('Sant\'Arpino (CE)')">Sant'Arpino</button>
        <button type="button" onclick="impostaComune('Succivo (CE)')">Succivo</button>
        <button type="button" onclick="impostaComune('Orta di Atella (CE)')">Orta Atella</button>
        <button type="button" onclick="impostaComune('Aversa (CE)')">Aversa</button>
        <button type="button" onclick="impostaComune('Marcianise (CE)')">Marcianise</button>
    </div>

    <label for="indirizzo_input">Aggiungi Indirizzo:</label>
    <input type="text" id="indirizzo_input" placeholder="Es. Via Roma 1">
    
    <button class="btn-add" onclick="aggiungi()">+ Aggiungi Indirizzo</button>
    
    <!-- Pulsante per ordinare il giro col GPS -->
    <button class="btn-optimize" onclick="ottimizzaGiroGPS()">📍 Ottimizza Giro (Usa mia posizione GPS)</button>

    <ul id="lista"></ul>
    
    <button class="btn-save" onclick="inviaAlDatabase()">🚀 Salva nel Cloud</button>
</div>

<script>
    const SUPABASE_URL = 'https://jfhejqhxtvhgfrjdfleq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_9VhqQ9KOTrhqnMuZH9_L8Q_u7s5zEXh';
    let tappe = []; // Ogni tappa conterrà testo e coordinate fittizie o reali

    function impostaComune(nomeComune) {
        document.getElementById('comune').value = nomeComune;
    }

    function aggiungi() {
        const ind = document.getElementById('indirizzo_input');
        const comuneInput = document.getElementById('comune').value.trim();
        
        if(ind.value.trim() !== "") {
            let indirizzoCompleto = ind.value.trim();
            if(comuneInput) {
                indirizzoCompleto += " (" + comuneInput + ")";
            }
            
            // Salviamo l'oggetto tappa
            tappe.push({ testo: indirizzoCompleto });
            aggiornaListaVisuale();
            ind.value = '';
        } else {
            alert("Inserisci un indirizzo valido!");
        }
    }

    function rimuoviTappa(index) {
        tappe.splice(index, 1);
        aggiornaListaVisuale();
    }

    function aggiornaListaVisuale() {
        const lista = document.getElementById('lista');
        lista.innerHTML = '';
        tappe.forEach((tappa, index) => {
            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(tappa.testo)}`;
            lista.innerHTML += `<li>
                <span>${index + 1}. ${tappa.testo}</span>
                <div class="actions">
                    <a href="${mapUrl}" target="_blank" class="map-link">📍 Mappa</a>
                    <button type="button" class="btn-delete" onclick="rimuoviTappa(${index})">❌ Elimina</button>
                </div>
            </li>`;
        });
    }

    // Funzione che sfrutta il GPS del telefono per ordinare le tappe
    function ottimizzaGiroGPS() {
        if (tappe.length === 0) {
            alert("Aggiungi prima qualche indirizzo da ordinare!");
            return;
        }

        if (!navigator.geolocation) {
            alert("Il tuo browser non supporta la geolocalizzazione.");
            return;
        }

        alert("Rilevamento posizione GPS in corso...");

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const latUtente = position.coords.latitude;
                const lonUtente = position.coords.longitude;

                // Per adesso, simuliamo l'ordinamento intelligente basato sulla posizione
                // (In futuro potremo collegarlo a un servizio di geocoding per calcolare i chilometri reali).
                alert(`Posizione GPS rilevata con successo! Lat: ${latUtente.toFixed(4)}, Lon: ${lonUtente.toFixed(4)}.\nLe tappe sono pronte per essere gestite.`);
                
                // Qui potremmo ordinare l'array 'tappe' in base alla vicinanza
            },
            (error) => {
                alert("Impossibile rilevare la posizione GPS. Assicurati di aver attivato i permessi di localizzazione sul telefono.");
            },
            { enableHighAccuracy: true }
        );
    }

    async function inviaAlDatabase() {
        const ditta = document.getElementById('ditta'].value;
        const comune = document.getElementById('comune').value;

        if(tappe.length === 0) {
            alert("Aggiungi almeno un indirizzo prima di salvare!");
            return;
        }

        // Estraiamo solo i testi delle tappe per salvarli nel database
        const arrayTesti = tappe.map(t => t.testo);
        const indirizziTesto = arrayTesti.join(" | ");

        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/Consegne`, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify({
                    ditta: ditta,
                    comune: comune,
                    indirizzi: indirizziTesto
                })
            });

            if (response.ok) {
                alert("Giro salvato con successo nel database!");
                tappe = [];
                document.getElementById('lista').innerHTML = '';
                document.getElementById('comune').value = '';
            } else {
                const errData = await response.json();
                alert("Errore dal server: " + (errData.message || response.statusText));
            }
        } catch (error) {
            alert("Errore di connessione: " + error.message);
        }
    }
</script>
</body>
</html>
