<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyDrop PRO V 3.8</title>
    <style>
        :root {
            --bg-body: #f4f6f9;
            --bg-container: #fff;
            --text-main: #333;
            --primary-color: #007bff;
            --btn-add: #28a745;
            --btn-opt: #17a2b8;
            --btn-guided: #ff9800;
            --btn-camera: #6f42c1;
        }
        body { font-family: sans-serif; background: var(--bg-body); margin: 0; padding: 15px; transition: background 0.3s ease; }
        .container { max-width: 480px; margin: auto; background: var(--bg-container); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: all 0.3s ease; position: relative; }
        
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h2 { text-align: center; color: var(--text-main); margin: 0; flex-grow: 1; }
        .menu-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-main); padding: 0 5px; }
        
        .side-menu { height: 100%; width: 0; position: fixed; z-index: 1000; top: 0; right: 0; background-color: #fff; overflow-x: hidden; transition: 0.3s; box-shadow: -4px 0 10px rgba(0,0,0,0.2); padding-top: 60px; }
        .side-menu a { padding: 12px 20px; text-decoration: none; font-size: 16px; color: #333; display: block; transition: 0.2s; border-bottom: 1px solid #eee; }
        .side-menu a:hover { background-color: #f1f1f1; color: var(--primary-color); }
        .side-menu .close-btn { position: absolute; top: 15px; right: 20px; font-size: 26px; border: none; background: none; cursor: pointer; }
        
        label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 12px; padding-right: 35px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        input:disabled { background-color: #e9ecef; cursor: not-allowed; }
        .input-container { position: relative; }
        .clear-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #888; font-size: 20px; font-weight: bold; padding: 0 5px; user-select: none; }
        
        .btn { width: 100%; padding: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 10px; transition: background 0.3s ease; }
        .btn-add { background: var(--btn-add); color: white; }
        .btn-opt { background: var(--btn-opt); color: white; }
        .btn-guided { background: var(--btn-guided); color: white; display: none; font-size: 16px; box-shadow: 0 3px 6px rgba(0,0,0,0.2); }
        .btn-camera { background: var(--btn-camera); color: white; margin-bottom: 10px; }
        
        #ocr-status { display: none; font-size: 13px; text-align: center; margin-top: 8px; font-weight: bold; padding: 6px; border-radius: 4px; }
        
        /* Modal Pop-up Conferma OCR */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box; }
        .modal-card { background: #fff; width: 100%; max-width: 400px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

        .batch-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding: 8px 10px; background: #e9ecef; border-radius: 6px; font-size: 14px; }
        .batch-buttons { display: flex; gap: 4px; }
        .btn-batch { border: none; padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; color: white; }
        .btn-batch-done { background: #28a745; }
        .btn-batch-highlight { background: #ffc107; color: #333; }
        .btn-batch-del { background: #dc3545; }
        
        .tappa { display: flex; justify-content: space-between; align-items: center; padding: 12px; margin-bottom: 8px; border-radius: 6px; background: #f8f9fa; border-left: 5px solid var(--primary-color); cursor: pointer; }
        .tappa-left { display: flex; align-items: center; gap: 10px; overflow: hidden; flex-direction: column; align-items: flex-start; width: 100%; }
        .tappa-text { width: 100%; display: flex; align-items: center; gap: 10px; }
        .tappa-note { font-size: 12px; color: #666; font-style: italic; margin-top: 4px; display: block; }
        .evidenziata { background: #fff3cd; border-left-color: #ffc107; }
        .fatta { background: #d4edda; border-left-color: #28a745; text-decoration: line-through; color: #6c757d; }
        .btn-del { background: #dc3545; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
        
        /* Z-index per suggerimenti Google Maps sopra la modale */
        .pac-container { z-index: 3000 !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <h2>EasyDrop PRO V 3.8 📦</h2>
        <button class="menu-btn" onclick="apriMenu()">☰</button>
    </div>
    
    <div id="sideMenu" class="side-menu">
        <button class="close-btn" onclick="chiudiMenu()">&times;</button>
        <a href="#" onclick="chiudiMenu(); alert('Sezione Profilo in arrivo');">👤 Profilo</a>
        <a href="#" onclick="chiudiMenu(); alert('Sezione Impostazioni in arrivo');">⚙️ Impostazioni</a>
    </div>
    
    <label>Ditta:</label>
    <select id="ditta" onchange="cambiaTemaDitta()">
        <option value="SDA">SDA</option>
        <option value="BRT">BRT</option>
        <option value="Poste Italiane">Poste Italiane</option>
        <option value="GLS">GLS</option>
        <option value="DHL">DHL</option>
    </select>
    
    <!-- Pulsante Fotocamera -->
    <button class="btn btn-camera" onclick="document.getElementById('cameraInput').click()">📷 Scansiona Destinatario (Foto)</button>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="elaboraFotoGoogleVision(event)">
    <div id="ocr-status"></div>

    <label>Comune:</label>
    <div class="input-container">
        <input type="text" id="comune" placeholder="Inizia a scrivere il comune...">
        <span class="clear-btn" onclick="pulisciCampo('comune')">&times;</span>
    </div>
    
    <label>Indirizzo:</label>
    <div class="input-container">
        <input type="text" id="indirizzo" placeholder="Seleziona prima il comune..." disabled>
        <span class="clear-btn" onclick="pulisciCampo('indirizzo')">&times;</span>
    </div>
    
    <label>Note (facoltativo):</label>
    <input type="text" id="note" placeholder="es. Citofono Rossi, ZTL, Pacco blu...">
    
    <button class="btn btn-add" onclick="aggiungiTappa()">+ Aggiungi Tappa</button>
    <button class="btn btn-opt" onclick="ottimizzaGiro()">📍 Ottimizza Giro (GPS)</button>
    <button id="btn-guided" class="btn btn-guided" onclick="avanziaGiro()">🚀 INIZIA GIRO</button>
    
    <div id="batch-bar" style="display:none;" class="batch-actions">
        <label style="margin:0; display:flex; align-items:center; gap:4px; cursor:pointer; font-size:13px;">
            <input type="checkbox" id="seleziona-tutti" onclick="toggleSelezionaTutti(this)"> Tutti
        </label>
        <div class="batch-buttons">
            <button class="btn-batch btn-batch-done" onclick="toggleFattaSelezionate()">✅ Fatta</button>
            <button class="btn-batch btn-batch-highlight" onclick="toggleEvidenziaSelezionate()">🟡 Evid.</button>
            <button class="btn-batch btn-batch-del" onclick="eliminaSelezionate()">🗑 Elimina</button>
        </div>
    </div>
    
    <div id="lista" style="margin-top: 15px;"></div>
</div>

<!-- Modal Pop-up con Autocomplete di Google -->
<div id="modal-ocr" class="modal-overlay">
    <div class="modal-card">
        <h3 style="margin-top:0; color:#333; text-align:center;">🔍 Conferma Destinatario</h3>
        <p style="font-size:12px; color:#666; text-align:center; margin-top:-10px;">I campi suggeriscono in automatico via e comune.</p>
        
        <label style="margin-top:5px;">Comune:</label>
        <input type="text" id="ocr-comune-input" placeholder="es. Napoli">
        
        <label style="margin-top:5px;">Indirizzo completo:</label>
        <input type="text" id="ocr-indirizzo-input" placeholder="es. Via Roma 15">
        
        <label style="margin-top:5px;">Note (opzionale):</label>
        <input type="text" id="ocr-note-input" placeholder="es. Citofono Rossi...">
        
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn btn-add" style="margin:0; flex:1;" onclick="confermaEAddTappaOCR()">✅ Aggiungi a lista</button>
            <button class="btn btn-batch-del" style="margin:0; width:auto; padding:0 15px; font-size:16px;" onclick="chiudiModalOCR()">❌</button>
        </div>
    </div>
</div>

<script>
    // =========================================================
    // 🔑 INSERISCI QUI LA TUA CHIAVE API GOOGLE
    // =========================================================
    const API_KEY_GOOGLE = "AIzaSyAtVYWeIyin713t6mQOUhz3f7NnDS-CCvI";

    // Caricamento dinamico dello script di Google Maps
    const scriptMaps = document.createElement('script');
    scriptMaps.src = `https://maps.googleapis.com/maps/api/js?key=${API_KEY_GOOGLE}&libraries=places&callback=initAutocomplete`;
    scriptMaps.async = true;
    document.head.appendChild(scriptMaps);

    let tappe = [];
    let geocoder;
    let autocompleteComune, autocompleteInd;
    let autoModalComune, autoModalInd;
    let comuneSelezionato = "";

    function apriMenu() { document.getElementById("sideMenu").style.width = "250px"; }
    function chiudiMenu() { document.getElementById("sideMenu").style.width = "0"; }

    function cambiaTemaDitta() {
        const ditta = document.getElementById('ditta').value;
        const root = document.documentElement;
        const temi = {
            "SDA": { body: '#eef3f9', primary: '#003366', opt: '#d4af37' },
            "BRT": { body: '#fcf2f2', primary: '#cc0000', opt: '#333333' },
            "Poste Italiane": { body: '#fdfae5', primary: '#004225', opt: '#004225' },
            "GLS": { body: '#f7f4f4', primary: '#002060', opt: '#c00000' },
            "DHL": { body: '#fffbe6', primary: '#d40511', opt: '#ffcc00' }
        };
        root.style.setProperty('--bg-body', temi[ditta].body);
        root.style.setProperty('--primary-color', temi[ditta].primary);
        root.style.setProperty('--btn-add', temi[ditta].primary);
        root.style.setProperty('--btn-guided', temi[ditta].primary);
        root.style.setProperty('--btn-opt', temi[ditta].opt);
    }
    window.addEventListener('DOMContentLoaded', cambiaTemaDitta);

    // Inizializzazione di tutti i campi Autocomplete Google (Home + Pop-up)
    window.initAutocomplete = function() {
        geocoder = new google.maps.Geocoder();
        
        // Home Screen
        autocompleteComune = new google.maps.places.Autocomplete(document.getElementById('comune'), { types: ['locality'], componentRestrictions: { country: 'it' } });
        autocompleteInd = new google.maps.places.Autocomplete(document.getElementById('indirizzo'), { componentRestrictions: { country: 'it' } });
        
        autocompleteComune.addListener('place_changed', function() {
            const place = autocompleteComune.getPlace();
            if (place.geometry) {
                comuneSelezionato = place.name;
                autocompleteInd.setBounds(place.geometry.viewport);
                document.getElementById('indirizzo').disabled = false;
                document.getElementById('indirizzo').placeholder = "Via in " + comuneSelezionato;
            }
        });

        // Pop-up Screen
        autoModalComune = new google.maps.places.Autocomplete(document.getElementById('ocr-comune-input'), { types: ['locality'], componentRestrictions: { country: 'it' } });
        autoModalInd = new google.maps.places.Autocomplete(document.getElementById('ocr-indirizzo-input'), { componentRestrictions: { country: 'it' } });
        
        autoModalComune.addListener('place_changed', function() {
            const place = autoModalComune.getPlace();
            if (place.geometry) {
                autoModalInd.setBounds(place.geometry.viewport);
            }
        });
    };

    function pulisciCampo(id) {
        document.getElementById(id).value = '';
        if (id === 'comune') {
            comuneSelezionato = "";
            document.getElementById('indirizzo').value = '';
            document.getElementById('indirizzo').disabled = true;
        }
    }

    async function geocodeAddress(address) {
        return new Promise((resolve) => {
            if (!geocoder) geocoder = new google.maps.Geocoder();
            geocoder.geocode({ address: address }, (results, status) => {
                if (status === 'OK' && results[0]) resolve({ lat: results[0].geometry.location.lat(), lng: results[0].geometry.location.lng() });
                else resolve(null);
            });
        });
    }

    async function aggiungiTappa() {
        let com = comuneSelezionato || document.getElementById('comune').value.trim();
        const indInput = document.getElementById('indirizzo').value.trim();
        const noteInput = document.getElementById('note').value.trim();
        
        if (!com || !indInput) { alert("Inserisci comune e indirizzo!"); return; }
        
        const indirizzoCompleto = `${indInput}, ${com}`;
        const coords = await geocodeAddress(indirizzoCompleto);
        
        tappe.push({ 
            indirizzo: indirizzoCompleto, note: noteInput, 
            cliccata: false, fatta: false, selezionata: false, 
            lat: coords ? coords.lat : null, lng: coords ? coords.lng : null 
        });
        
        document.getElementById('indirizzo').value = ''; document.getElementById('note').value = '';
        render();
    }

    // =========================================================
    // INTEGRAZIONE GOOGLE CLOUD VISION API (MOLTO PIÙ POTENTE)
    // =========================================================
    async function elaboraFotoGoogleVision(event) {
        const file = event.target.files[0];
        if (!file) return;

        const statusEl = document.getElementById('ocr-status');
        statusEl.style.display = 'block';
        statusEl.style.background = '#e9ecef';
        statusEl.style.color = '#007bff';
        statusEl.innerText = '☁️ Analisi con intelligenza artificiale Google in corso...';

        const reader = new FileReader();
        reader.onloadend = async () => {
            try {
                // Estraggo il Base64 senza il prefisso "data:image/jpeg;base64,"
                const base64data = reader.result.split(',')[1];
                const url = `https://vision.googleapis.com/v1/images:annotate?key=${API_KEY_GOOGLE}`;
                
                const requestBody = {
                    requests: [{
                        image: { content: base64data },
                        features: [{ type: "DOCUMENT_TEXT_DETECTION" }] // Specifica per documenti
                    }]
                };

                const response = await fetch(url, { method: 'POST', body: JSON.stringify(requestBody) });
                const data = await response.json();

                if (data.responses && data.responses[0].fullTextAnnotation) {
                    analizzaECompilaTesto(data.responses[0].fullTextAnnotation.text);
                    statusEl.style.display = 'none';
                } else {
                    throw new Error("Nessun testo rilevato");
                }
            } catch (err) {
                console.error(err);
                statusEl.style.background = '#f8d7da';
                statusEl.style.color = '#721c24';
                statusEl.innerText = '❌ Errore API o testo illeggibile.';
            } finally {
                event.target.value = '';
            }
        };
        reader.readAsDataURL(file);
    }

    function analizzaECompilaTesto(testoCompleto) {
        let txt = testoCompleto.toUpperCase();
        
        // Cerca di prendere solo la parte dopo Destinatario/Spett.le, ignorando il mittente
        let indexDest = Math.max(txt.indexOf("DESTINATAR"), txt.indexOf("SPETT"));
        if (indexDest !== -1) {
            txt = txt.substring(indexDest);
        }

        let viaTrovata = "";
        let comuneTrovato = "";

        // Regex migliorata per Via/Viale/Corso/ecc.
        const matchVia = txt.match(/(VIA|PIAZZA|P\.ZZA|VIALE|V\.LE|CORSO|C\.SO|LARGO|VICOLO|C\.DA|TRAVERSA|TRV\.)\s+[A-Z0-9\s\.\,\'\-]+/);
        if (matchVia) { viaTrovata = matchVia[0].split('\n')[0].trim(); }

        // Regex per CAP (5 cifre) e Comune
        const matchComune = txt.match(/\b\d{5}\b\s+([A-Z\s\'\-]+)/);
        if (matchComune && matchComune[1]) {
            comuneTrovato = matchComune[1].replace(/\s+[A-Z]{2}$/, '').split('\n')[0].trim();
        }

        // Se non trovo il comune, usa quello della home
        if (!comuneTrovato) comuneTrovato = document.getElementById('comune').value || "";

        mostraModalOCR(comuneTrovato, viaTrovata);
    }

    function mostraModalOCR(comune, indirizzo) {
        document.getElementById('ocr-comune-input').value = comune;
        document.getElementById('ocr-indirizzo-input').value = indirizzo;
        document.getElementById('ocr-note-input').value = '';
        document.getElementById('modal-ocr').style.display = 'flex';
        
        // Simulo un focus per caricare il viewport di Google Places per l'indirizzo
        if (comune) document.getElementById('ocr-indirizzo-input').focus();
    }

    function chiudiModalOCR() { document.getElementById('modal-ocr').style.display = 'none'; }

    async function confermaEAddTappaOCR() {
        const com = document.getElementById('ocr-comune-input').value.trim();
        const ind = document.getElementById('ocr-indirizzo-input').value.trim();
        const note = document.getElementById('ocr-note-input').value.trim();

        if (!com || !ind) { alert("Completa i campi nel pop-up!"); return; }

        const indirizzoCompleto = `${ind}, ${com}`;
        const coords = await geocodeAddress(indirizzoCompleto);

        tappe.push({ 
            indirizzo: indirizzoCompleto, note: note, 
            cliccata: false, fatta: false, selezionata: false, 
            lat: coords ? coords.lat : null, lng: coords ? coords.lng : null 
        });

        // Riporta il comune confermato anche sulla Home
        document.getElementById('comune').value = com;
        comuneSelezionato = com;
        document.getElementById('indirizzo').disabled = false;
        
        chiudiModalOCR();
        render();
    }

    function render() {
        const list = document.getElementById('lista');
        const batchBar = document.getElementById('batch-bar');
        list.innerHTML = '';
        
        if (tappe.length > 0) batchBar.style.display = 'flex';
        else { batchBar.style.display = 'none'; document.getElementById('seleziona-tutti').checked = false; }
        
        tappe.forEach((t, i) => {
            let classeStato = t.fatta ? 'fatta' : (t.cliccata ? 'evidenziata' : '');
            
            list.innerHTML += `<div class="tappa ${classeStato}" onclick="apriNavigatore(${i})">
                    <div class="tappa-left">
                        <div class="tappa-text">
                            <input type="checkbox" ${t.selezionata ? 'checked' : ''} onclick="event.stopPropagation(); toggleSelezionaTappa(${i}, this)">
                            <span><strong>${i + 1}.</strong> ${t.indirizzo}</span>
