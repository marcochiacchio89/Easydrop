<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyDrop - Gestione Consegne</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; max-width: 600px; margin: 0 auto; }
        h1 { font-size: 1.4rem; margin-bottom: 15px; text-align: center; color: var(--primary); }
        .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
        input[type="text"], input[type="file"], select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; margin-bottom: 15px; background-color: #fff; }
        input:disabled { background-color: #e9ecef; cursor: not-allowed; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; background: var(--primary); color: white; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; }
        button:hover { background: var(--primary-hover); }
        button.secondary { background: #64748b; }
        button.danger { background: #ef4444; }
        #map { width: 100%; height: 250px; border-radius: 8px; margin-top: 10px; }
        .stop-list { list-style: none; margin-top: 10px; }
        .stop-item { display: flex; flex-direction: column; padding: 10px; border-bottom: 1px solid var(--border); gap: 5px; }
        .stop-item:last-child { border-bottom: none; }
        .stop-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .stop-details { font-size: 0.9rem; color: #475569; }
        .loading { display: none; text-align: center; color: var(--primary); font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>

    <h1>EasyDrop - Inserimento Spedizione</h1>

    <div class="card">
        <!-- CAMPO DITTA -->
        <label for="dittaInput">🏢 Ditta (Opzionale)</label>
        <input type="text" id="dittaInput" placeholder="Nome della ditta o negozio...">

        <!-- SELEZIONE COMUNE -->
        <label for="comuneSelect">📍 Comune di Consegna</label>
        <select id="comuneSelect" onchange="sbloccaIndirizzo()">
            <option value="">-- Seleziona un Comune --</option>
            <option value="Marcianise">Marcianise</option>
            <option value="Sant'Arpino">Sant'Arpino</option>
            <option value="Caserta">Caserta</option>
            <option value="Maddaloni">Maddaloni</option>
            <option value="Capua">Capua</option>
            <option value="Aversa">Aversa</option>
            <option value="Napoli">Napoli</option>
            <!-- Aggiungi qui sotto gli altri comuni della tua zona -->
        </select>

        <!-- CAMPO INDIRIZZO -->
        <label for="addressInput">🏠 Indirizzo</label>
        <input type="text" id="addressInput" placeholder="Prima seleziona il comune in alto..." disabled>
        
        <!-- FOTOCAMERA -->
        <label for="cameraInput">📷 Scansiona Etichetta Pacco (Autocompila)</label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment">

        <div id="loading" class="loading">⏳ Lettura etichetta in corso...</div>

        <div class="btn-group" style="margin-top: 5px;">
            <button onclick="addStop()">Aggiungi alla Lista</button>
        </div>
    </div>

    <div class="card">
        <h3>🗺️ Mappa Itinerario</h3>
        <div id="map"></div>
    </div>

    <div class="card">
        <h3>📦 Lista Fermate</h3>
        <ul id="stopList" class="stop-list"></ul>
        <div class="btn-group" style="margin-top: 15px;">
            <button class="danger" onclick="clearStops()">Svuota Lista</button>
        </div>
    </div>

    <script>
        // =========================================================================
        // 🔑 INSERISCI LA TUA CHIAVE API GOOGLE QUI (UNICO PUNTO)
        // =========================================================================
        const API_KEY_GOOGLE = "AIzaSyAtVYWeIyin713t6mQOUhz3f7NnDS-CCvI";
        // =========================================================================

        let map, autocomplete, directionsService, directionsRenderer;
        let stopsData = []; // Array per salvare tutti i dettagli (ditta, comune, indirizzo)
        let routePoints = []; // Array solo per gli indirizzi da passare alla mappa

        // Sblocca il campo indirizzo solo dopo aver scelto il comune
        function sbloccaIndirizzo() {
            const comune = document.getElementById("comuneSelect").value;
            const inputIndirizzo = document.getElementById("addressInput");
            
            if (comune !== "") {
                inputIndirizzo.disabled = false;
                inputIndirizzo.placeholder = "Digita la via...";
            } else {
                inputIndirizzo.disabled = true;
                inputIndirizzo.value = "";
                inputIndirizzo.placeholder = "Prima seleziona il comune in alto...";
            }
        }

        function loadGoogleMapsScript() {
            if (!API_KEY_GOOGLE || API_KEY_GOOGLE === "INSERISCI_LA_TUA_CHIAVE_API_QUI") {
                alert("⚠️ ATTENZIONE: Inserisci la tua API Key all'inizio del codice!");
                return;
            }
            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${API_KEY_GOOGLE}&libraries=places&callback=initMap`;
            script.async = true;
            script.defer = true;
            document.head.appendChild(script);
        }

        function initMap() {
            const defaultCenter = { lat: 41.033, lng: 14.298 }; // Mappa centrata in zona
            map = new google.maps.Map(document.getElementById("map"), { zoom: 11, center: defaultCenter });

            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer();
            directionsRenderer.setMap(map);

            const input = document.getElementById("addressInput");
            // Restringiamo l'autocomplete all'Italia
            autocomplete = new google.maps.places.Autocomplete(input, {
                componentRestrictions: { country: "it" }
            });
        }

        // Gestione OCR Cloud Vision
        document.getElementById('cameraInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            showLoading(true);
            try {
                const base64Image = await convertBase64(file);
                const cleanedBase64 = base64Image.replace(/^data:image\/(png|jpg|jpeg);base64,/, "");

                const response = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=${API_KEY_GOOGLE}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        requests: [{ image: { content: cleanedBase64 }, features: [{ type: 'TEXT_DETECTION' }] }]
                    })
                });

                const data = await response.json();
                
                if (data.responses && data.responses[0] && data.responses[0].fullTextAnnotation) {
                    const detectedText = data.responses[0].fullTextAnnotation.text;
                    // Mette il testo grezzo nell'indirizzo da farti sistemare
                    document.getElementById('addressInput').value = extractAddress(detectedText);
                    document.getElementById('addressInput').disabled = false; // Forza sblocco per editare
                } else {
                    alert("Nessun testo letto con chiarezza sull'etichetta.");
                }
            } catch (err) {
                alert("Errore nella lettura della foto con la Cloud Vision API.");
            } finally {
                showLoading(false);
            }
        });

        function convertBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function extractAddress(text) {
            const lines = text.split('\n').filter(line => line.trim().length > 3);
            return lines.slice(0, 3).join(', ');
        }

        function addStop() {
            const ditta = document.getElementById("dittaInput").value.trim();
            const comune = document.getElementById("comuneSelect").value;
            const indirizzo = document.getElementById("addressInput").value.trim();

            if (!comune || !indirizzo) {
                alert("Devi selezionare un comune e inserire l'indirizzo!");
                return;
            }

            // Uniamo comune e indirizzo per Google Maps
            const fullAddress = `${indirizzo}, ${comune}`;

            stopsData.push({ ditta, comune, indirizzo });
            routePoints.push(fullAddress);

            // Svuota i campi dopo l'inserimento
            document.getElementById("dittaInput").value = "";
            document.getElementById("addressInput").value = "";
            // Il comune lo lasciamo selezionato, comodo se devi fare più pacchi nello stesso paese
            
            renderStops();
            updateRoute();
        }

        function renderStops() {
            const list = document.getElementById("stopList");
            list.innerHTML = "";
            stopsData.forEach((stop, idx) => {
                const li = document.createElement("li");
                li.className = "stop-item";
                
                let titleHtml = stop.ditta ? `<b>${idx + 1}. 🏢 ${stop.ditta}</b>` : `<b>${idx + 1}. 🏠 Privato</b>`;
                
                li.innerHTML = `
                    <div class="stop-header">
                        <span>${titleHtml}</span>
                        <button class="secondary" style="padding: 4px 8px; flex: initial;" onclick="removeStop(${idx})">❌</button>
                    </div>
                    <div class="stop-details">
                        📍 ${stop.indirizzo}<br>
                        🏙️ ${stop.comune}
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function removeStop(idx) {
            stopsData.splice(idx, 1);
            routePoints.splice(idx, 1);
            renderStops();
            updateRoute();
        }

        function clearStops() {
            stopsData = [];
            routePoints = [];
            renderStops();
            if (directionsRenderer) directionsRenderer.setDirections({ routes: [] });
        }

        function updateRoute() {
            if (routePoints.length < 2 || !directionsService) return;
            
            const waypoints = routePoints.slice(1, -1).map(s => ({ location: s, stopover: true }));
            directionsService.route({
                origin: routePoints[0],
                destination: routePoints[routePoints.length - 1],
                waypoints: waypoints,
                optimizeWaypoints: true,
                travelMode: google.maps.TravelMode.DRIVING
            }, (result, status) => {
                if (status === 'OK') {
                    directionsRenderer.setDirections(result);
                }
            });
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        loadGoogleMapsScript();
    </script>
</body>
</html>
