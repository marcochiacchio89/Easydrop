<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyDrop PRO V 3.5</title>
    <!-- Mantenuta esattamente la callback originale per Google Maps -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAtVYWeIyin713t6mQOUhz3f7NnDS-CCvI&libraries=places&callback=initAutocomplete" async defer></script>
    <style>
        :root {
            --bg-body: #f4f6f9;
            --bg-container: #fff;
            --text-main: #333;
            --primary-color: #007bff;
            --btn-add: #28a745;
            --btn-opt: #17a2b8;
            --btn-guided: #ff9800;
        }

        body { font-family: sans-serif; background: var(--bg-body); margin: 0; padding: 15px; transition: background 0.3s ease; }
        .container { max-width: 480px; margin: auto; background: var(--bg-container); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: all 0.3s ease; position: relative; }
        
        /* Header con Titolo e Menu Hamburger */
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h2 { text-align: center; color: var(--text-main); margin: 0; flex-grow: 1; }
        .menu-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-main); padding: 0 5px; }
        
        /* Menu Hamburger Laterale */
        .side-menu { height: 100%; width: 0; position: fixed; z-index: 1000; top: 0; right: 0; background-color: #fff; overflow-x: hidden; transition: 0.3s; box-shadow: -4px 0 10px rgba(0,0,0,0.2); padding-top: 60px; }
        .side-menu a { padding: 12px 20px; text-decoration: none; font-size: 16px; color: #333; display: block; transition: 0.2s; border-bottom: 1px solid #eee; }
        .side-menu a:hover { background-color: #f1f1f1; color: var(--primary-color); }
        .side-menu .close-btn { position: absolute; top: 15px; right: 20px; font-size: 26px; border: none; background: none; cursor: pointer; }

        label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 12px; padding-right: 35px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        select { padding-right: 12px; }
        input:disabled { background-color: #e9ecef; cursor: not-allowed; }
        .input-container { position: relative; }
        .clear-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #888; font-size: 20px; font-weight: bold; padding: 0 5px; user-select: none; }
        .clear-btn:hover { color: #333; }

        /* Input file nascosto per la fotocamera */
        .hidden-file { opacity: 0; width: 0.1px; height: 0.1px; position: absolute; z-index: -1; }

        /* Sezione Fotocamera IA sotto Indirizzo */
        .camera-container { display: flex; align-items: center; gap: 10px; margin: 8px 0 12px 0; background: #f8f9fa; padding: 8px 12px; border-radius: 8px; border: 1px solid #e0e0e0; }
        .btn-camera { background: var(--primary-color); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .camera-text { font-size: 13px; font-weight: 600; color: #555; margin: 0; }

        /* Overlay Scansione IA */
        .ocr-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .ocr-overlay.hidden { display: none; }
        .ocr-card { background: #fff; padding: 20px; border-radius: 12px; width: 85%; max-width: 380px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .preview-container { position: relative; max-height: 220px; overflow: hidden; border-radius: 8px; margin: 15px 0; background: #000; }
        .preview-container img { width: 100%; object-fit: contain; }
        .scan-line { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: #28a745; box-shadow: 0 0 8px #28a745; animation: scan 1.5s infinite ease-in-out; }
        @keyframes scan { 0% { top: 0%; } 50% { top: 95%; } 100% { top: 0%; } }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 10px; transition: background 0.3s ease; }
        .btn-add { background: var(--btn-add); color: white; }
        .btn-opt { background: var(--btn-opt); color: white; }
        .btn-guided { background: var(--btn-guided); color: white; display: none; font-size: 16px; box-shadow: 0 3px 6px rgba(0,0,0,0.2); }
        .btn-cancel { background: #dc3545; color: white; padding: 10px; border: none; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* Barra strumenti selezioni multiple */
        .batch-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding: 8px 10px; background: #e9ecef; border-radius: 6px; font-size: 14px; }
        .batch-buttons { display: flex; gap: 4px; }
        .btn-batch { border: none; padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; color: white; }
        .btn-batch-done { background: #28a745; }
        .btn-batch-highlight { background: #ffc107; color: #333; }
        .btn-batch-del { background: #dc3545; }
        
        .tappa { display: flex; justify-content: space-between; align-items: center; padding: 12px; margin-bottom: 8px; border-radius: 6px; background: #f8f9fa; border-left: 5px solid var(--primary-color); cursor: pointer; }
        .tappa-left { display: flex; align-items: center; gap: 10px; overflow: hidden; flex-direction: column; align-items: flex-start; width: 100%; }
        .tappa-text { width: 100%; display: flex; align-items: center; gap: 10px; }
        .tappa-note { font-size: 12px; color: #666; font-style: italic; margin-top: 4px; display: block; }
        .evidenziata { background: #fff3cd; border-left-color: #ffc107; }
        .fatta { background: #d4edda; border-left-color: #28a745; text-decoration: line-through; color: #6c757d; }
        .btn-del { background: #dc3545; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <div class="app-header">
        <h2>EasyDrop PRO V 3.5 📦</h2>
        <button class="menu-btn" onclick="apriMenu()">☰</button>
    </div>

    <!-- Menu Hamburger Laterale -->
    <div id="sideMenu" class="side-menu">
        <button class="close-btn" onclick="chiudiMenu()">&times;</button>
        <a href="#" onclick="chiudiMenu(); alert('Sezione Profilo in arrivo');">👤 Profilo</a>
        <a href="#" onclick="chiudiMenu(); alert('Sezione Impostazioni in arrivo');">⚙️ Impostazioni</a>
        <a href="#" onclick="chiudiMenu(); alert('Sezione Assistenza in arrivo');">🛠️ Assistenza</a>
    </div>

    <label>Ditta:</label>
    <select id="ditta" onchange="cambiaTemaDitta()">
        <option value="SDA">SDA</option>
        <option value="BRT">BRT</option>
        <option value="Poste Italiane">Poste Italiane</option>
        <option value="GLS">GLS</option>
        <option value="DHL">DHL</option>
    </select>
    <label>Comune:</label>
    <div class="input-container">
        <input type="text" id="comune" placeholder="Inizia a scrivere il comune...">
        <span class="clear-btn" onclick="pulisciCampo('comune')">&times;</span>
    </div>
    <label>Indirizzo:</label>
    <div class="input-container">
        <input type="text" id="indirizzo" placeholder="Seleziona prima il comune..." disabled>
        <span class="clear-btn" onclick="pulisciCampo('indirizzo')">&times;</span>
    </div>

    <!-- Sezione Fotocamera IA sotto Indirizzo -->
    <div class="camera-container">
        <input type="file" id="cameraInput" class="hidden-file" accept="image/*" capture="environment" onchange="gestisciFotoLDV(event)">
        <label for="cameraInput" class="btn-camera" title="Scatta foto LDV">📷</label>
        <span class="camera-text">Usa la fotocamera per identificare l'indirizzo</span>
    </div>

    <label>Note (facoltativo):</label>
    <input type="text" id="note" placeholder="es. Citofono Rossi, ZTL, Pacco blu...">
    
    <button class="btn btn-add" onclick="aggiungiTappa()">+ Aggiungi Tappa</button>
    <button class="btn btn-opt" onclick="ottimizzaGiro()">📍 Ottimizza Giro (GPS)</button>
    <button id="btn-guided" class="btn btn-guided" onclick="avanziaGiro()">🚀 INIZIA GIRO</button>
    
    <div id="batch-bar" style="display:none;" class="batch-actions">
        <label style="margin:0; display:flex; align-items:center; gap:4px; cursor:pointer; font-size:13px;">
            <input type="checkbox" id="seleziona-tutti" onclick="toggleSelezionaTutti(this)"> Tutti
        </label>
        <div class="batch-buttons">
            <button class="btn-batch btn-batch-done" onclick="toggleFattaSelezionate()">✅ Fatta</button>
            <button class="btn-batch btn-batch-highlight" onclick="toggleEvidenziaSelezionate()">🟡 Evidenzia</button>
            <button class="btn-batch btn-batch-del" onclick="eliminaSelezionate()">🗑 Elimina</button>
        </div>
    </div>

    <div id="lista" style="margin-top: 15px;"></div>
</div>

<!-- Modal di Scansione/Lettura IA -->
<div id="ocrOverlay" class="ocr-overlay hidden">
    <div class="ocr-card">
        <h4 style="margin:0 0 10px 0; color:#333;">Scansione LDV in corso...</h4>
        <div class="preview-container">
            <img id="ldvPreview" src="" alt="Anteprima LDV">
            <div class="scan-line"></div>
        </div>
        <p style="font-size:13px; color:#666; margin-bottom:10px;">L'IA sta estraendo l'indirizzo di destinazione.</p>
        <button class="btn-cancel" onclick="annullaScansione()">Annulla</button>
    </div>
</div>

<script>
    let tappe = [];
    let geocoder;
    let autocompleteComune;
    let autocompleteInd;
    let comuneSelezionato = "";

    function apriMenu() {
        document.getElementById("sideMenu").style.width = "250px";
    }

    function chiudiMenu() {
        document.getElementById("sideMenu").style.width = "0";
    }

    function cambiaTemaDitta() {
        const ditta = document.getElementById('ditta').value;
        const root = document.documentElement;

        if (ditta === "SDA") {
            root.style.setProperty('--bg-body', '#eef3f9');
            root.style.setProperty('--primary-color', '#003366');
            root.style.setProperty('--btn-add', '#003366');
            root.style.setProperty('--btn-opt', '#d4af37');
            root.style.setProperty('--btn-guided', '#003366');
        } else if (ditta === "BRT") {
            root.style.setProperty('--bg-body', '#fcf2f2');
            root.style.setProperty('--primary-color', '#cc0000');
            root.style.setProperty('--btn-add', '#cc0000');
            root.style.setProperty('--btn-opt', '#333333');
            root.style.setProperty('--btn-guided', '#cc0000');
        } else if (ditta === "Poste Italiane") {
            root.style.setProperty('--bg-body', '#fdfae5');
            root.style.setProperty('--primary-color', '#004225');
            root.style.setProperty('--btn-add', '#e6af00');
            root.style.setProperty('--btn-opt', '#004225');
            root.style.setProperty('--btn-guided', '#e6af00');
        } else if (ditta === "GLS") {
            root.style.setProperty('--bg-body', '#f7f4f4');
            root.style.setProperty('--primary-color', '#002060');
            root.style.setProperty('--btn-add', '#002060');
            root.style.setProperty('--btn-opt', '#c00000');
            root.style.setProperty('--btn-guided', '#002060');
        } else if (ditta === "DHL") {
            root.style.setProperty('--bg-body', '#fffbe6');
            root.style.setProperty('--primary-color', '#d40511');
            root.style.setProperty('--btn-add', '#d40511');
            root.style.setProperty('--btn-opt', '#ffcc00');
            root.style.setProperty('--btn-guided', '#d40511');
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        cambiaTemaDitta();
    });

    function initAutocomplete() {
        try {
            geocoder = new google.maps.Geocoder();
            autocompleteComune = new google.maps.places.Autocomplete(document.getElementById('comune'), { types: ['locality'], componentRestrictions: { country: 'it' } });
            autocompleteInd = new google.maps.places.Autocomplete(document.getElementById('indirizzo'), { componentRestrictions: { country: 'it' } });

            autocompleteComune.addListener('place_changed', function() {
                const place = autocompleteComune.getPlace();
                const indInput = document.getElementById('indirizzo');
                if (place && place.geometry && place.geometry.viewport) {
                    comuneSelezionato = place.name || document.getElementById('comune').value;
                    autocompleteInd.setBounds(place.geometry.viewport);
                    autocompleteInd.setOptions({ strictBounds: true });
                    indInput.disabled = false;
                    indInput.value = '';
                    indInput.placeholder = "Via in " + comuneSelezionato;
                }
            });

            document.getElementById('comune').addEventListener('input', function() {
                const val = this.value.trim();
                const indInput = document.getElementById('indirizzo');
                if (val === "") {
                    comuneSelezionato = "";
                    indInput.value = "";
                    indInput.disabled = true;
                    indInput.placeholder = "Seleziona prima il comune...";
                } else {
                    indInput.disabled = false;
                    indInput.placeholder = "Inserisci via...";
                }
            });
        } catch (e) { console.error("Errore:", e); }
    }

    function pulisciCampo(id) {
        const el = document.getElementById(id);
        el.value = '';
        if (id === 'comune') {
            comuneSelezionato = "";
            const indInput = document.getElementById('indirizzo');
            indInput.value = '';
            indInput.disabled = true;
            indInput.placeholder = "Seleziona prima il comune...";
        }
        el.focus();
    }

    /* Gestione della Fotocamera e Anteprima */
    function gestisciFotoLDV(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('ldvPreview').src = e.target.result;
            document.getElementById('ocrOverlay').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
    }

    function annullaScansione() {
        document.getElementById('ocrOverlay').classList.add('hidden');
        document.getElementById('cameraInput').value = '';
    }

    function geocodeAddress(address) {
        return new Promise((resolve) => {
            if (!geocoder) { geocoder = new google.maps.Geocoder(); }
            geocoder.geocode({ address: address }, (results, status) => {
                if (status === 'OK' && results && results[0] && results[0].geometry) {
                    resolve({ lat: results[0].geometry.location.lat(), lng: results[0].geometry.location.lng() });
                } else { resolve(null); }
            });
        });
    }

    async function aggiungiTappa() {
        let com = comuneSelezionato || document.getElementById('comune').value.trim();
        const indInput = document.getElementById('indirizzo').value.trim();
        const noteInput = document.getElementById('note').value.trim();
        
        if (!com || !indInput) { alert("Inserisci sia il comune che l'indirizzo!"); return; }

        const indirizzoCompleto = `${indInput}, ${com}`;
        let lat = null;
        let lng = null;

        const place = autocompleteInd.getPlace();
        if (place && place.geometry && place.geometry.location) {
            lat = place.geometry.location.lat();
            lng = place.geometry.location.lng();
        } else {
            const coords = await geocodeAddress(indirizzoCompleto);
            if (coords) { lat = coords.lat; lng = coords.lng; }
        }

        tappe.push({ indirizzo: indirizzoCompleto, note: noteInput, cliccata: false, fatta: false, selezionata: false, lat: lat, lng: lng });
        document.getElementById('indirizzo').value = '';
        document.getElementById('note').value = '';
        render();
    }

    function render() {
        const list = document.getElementById('lista');
        const batchBar = document.getElementById('batch-bar');
        list.innerHTML = '';
        
        if (tappe.length > 0) batchBar.style.display = 'flex';
        else { batchBar.style.display = 'none'; document.getElementById('seleziona-tutti').checked = false; }

        tappe.forEach((t, i) => {
            let classeStato = '';
            if (t.fatta) classeStato = 'fatta';
            else if (t.cliccata) classeStato = 'evidenziata';
            
            list.innerHTML += `<div class="tappa ${classeStato}" onclick="apriNavigatore(${i})">
                    <div class="tappa-left">
                        <div class="tappa-text">
                            <input type="checkbox" ${t.selezionata ? 'checked' : ''} onclick="event.stopPropagation(); toggleSelezionaTappa(${i}, this)">
                            <span><strong>${i + 1}.</strong> ${t.indirizzo}</span>
                        </div>
                        ${t.note ? `<span class="tappa-note">📝 ${t.note}</span>` : ''}
                    </div>
                    <button class="btn-del" onclick="event.stopPropagation(); rimuoviTappa(${i})">X</button>
                </div>`;
        });
        aggiornaPulsanteGuida();
    }

    function toggleSelezionaTappa(i, checkbox) {
        tappe[i].selezionata = checkbox.checked;
        const tuttiSelezionati = tappe.length > 0 && tappe.every(t => t.selezionata);
        document.getElementById('seleziona-tutti').checked = tuttiSelezionati;
    }

    function toggleSelezionaTutti(checkbox) {
        const stato = checkbox.checked;
        tappe.forEach(t => t.selezionata = stato);
        render();
    }

    function toggleFattaSelezionate() {
        const selezionate = tappe.filter(t => t.selezionata);
        if (selezionate.length === 0) { alert("Seleziona almeno una tappa."); return; }
        const tutteFatte = selezionate.every(t => t.fatta);
        selezionate.forEach(t => { t.fatta = !tutteFatte; if (!tutteFatte) t.cliccata = false; });
        render();
    }

    function toggleEvidenziaSelezionate() {
        const selezionate = tappe.filter(t => t.selezionata);
        if (selezionate.length === 0) { alert("Seleziona almeno una tappa."); return; }
        const tutteEvidenziate = selezionate.every(t => t.cliccata);
        selezionate.forEach(t => { t.cliccata = !tutteEvidenziate; });
        render();
    }

    function eliminaSelezionate() {
        const daEliminare = tappe.filter(t => t.selezionata).length;
        if (daEliminare === 0) { alert("Seleziona almeno una tappa."); return; }
        if (confirm(`Vuoi eliminare ${daEliminare} tappe?`)) {
            tappe = tappe.filter(t => !t.selezionata);
            document.getElementById('seleziona-tutti').checked = false;
            render();
        }
    }

    function rimuoviTappa(i) { tappe.splice(i, 1); render(); }

    function apriNavigatore(i) {
        if (tappe[i].fatta) return;
        tappe[i].cliccata = true;
        render();
        const url = `https://www.google.com/maps/
